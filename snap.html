<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1720">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="종로 사진">
    <title>종로 사진 - 보조앱</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/config.js?v=snap2"></script>
    <script src="js/auth.js?v=snap2"></script>
    <script src="js/photo-uploader.js?v=snap2"></script>
    <script src="js/awms-parseValue.js?v=snap-qr"></script>
    <script src="js/qr-scanner.js?v=snap-qr"></script>
    <script src="js/lcd-crop.js?v=snap-yolo"></script>
    <!-- YOLO(onnxruntime+lcd-yolo)는 무거워서 옵션 ON 시 지연 로드(loadYolo) -->
    <style>
      :root{
        --bg:#0f1720; --card:#172230; --ink:#f2f6fb; --ink-2:#aab8c8;
        --line:#28384a; --mint:#34d399; --mint-d:#10b981; --amber:#f59e0b; --red:#f87171;
        --btn:#1f2d3d; --btn-press:#2a3d52;
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
      html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
        font-size:18px; -webkit-user-select:none; user-select:none;}
      body{padding:14px 14px calc(74px + env(safe-area-inset-bottom));}

      .top{display:flex; align-items:center; justify-content:space-between;
        font-size:16px; color:var(--ink-2); padding:4px 2px 12px;}
      .top .who{font-weight:800; color:var(--ink);}
      .top .refresh{background:var(--btn); border:1px solid var(--line); color:var(--ink);
        font-size:15px; font-weight:700; padding:8px 14px; border-radius:10px; cursor:pointer;}

      .seq-wrap{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:16px 14px 18px; margin-bottom:14px;}
      .seq-label{text-align:center; font-size:17px; font-weight:800; color:var(--ink-2);
        letter-spacing:.04em; margin-bottom:10px;}
      .seq-row{display:flex; align-items:stretch; gap:12px;}
      .seq-btn{flex:1; min-height:88px; font-size:26px; font-weight:900; color:var(--ink);
        background:var(--btn); border:2px solid var(--line); border-radius:16px;
        display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;}
      .seq-btn:active{background:var(--btn-press); transform:scale(.98);}
      .seq-num{flex:0 0 110px; min-height:88px; border-radius:16px;
        background:var(--mint-d); color:#04130d; font-size:52px; font-weight:900;
        display:flex; align-items:center; justify-content:center;}
      .seq-meter{text-align:center; margin-top:12px; font-size:18px; font-weight:700;}
      .seq-meter .no{color:var(--mint);}
      .seq-meter .none{color:var(--amber);}

      .shot{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:14px; margin-bottom:14px;}
      .shot-title{font-size:20px; font-weight:800; margin:0 2px 10px; display:flex; justify-content:space-between; align-items:center;}
      .shot-status{font-size:15px; font-weight:700;}
      .shot-status.saving{color:var(--amber);}
      .shot-status.saved{color:var(--mint);}
      .shot-status.err{color:var(--red);}
      /* 업로드 현황 도크 — 하단 고정 요약 바 + 펼침 리스트 (어르신용 큰 글씨) */
      .uj-dock{position:fixed; left:0; right:0; bottom:0; z-index:2500;}
      .uj-bar{display:flex; align-items:center; justify-content:space-between;
        padding:14px 16px calc(14px + env(safe-area-inset-bottom));
        background:#1e293b; color:#fff; font-size:17px; font-weight:800;
        border-top:2px solid #334155; box-shadow:0 -3px 12px rgba(0,0,0,.4);}
      .uj-bar.has-fail{background:#b91c1c; border-top-color:#ef4444;}
      .uj-bar.all-ok{background:#065f46; border-top-color:#10b981;}
      .uj-bar .uj-tog{font-size:14px; font-weight:700; opacity:.9;}
      .uj-panel{max-height:0; overflow:hidden; background:#0f1b2a; transition:max-height .22s;}
      .uj-panel.open{max-height:46vh; overflow-y:auto;}
      .uj-list-inner{padding:10px 12px;}
      .uj-item{display:flex; align-items:center; gap:10px; padding:13px 12px; border-radius:12px;
        margin-bottom:8px; font-size:18px; font-weight:800;}
      .uj-item .lbl{flex:1;}
      .uj-item.up{background:#3a2c10; color:#fcd34d;}
      .uj-item.ok{background:#0d2f24; color:#34d399;}
      .uj-item.fail{background:#3a1414; color:#fca5a5;}
      .uj-retry{background:#dc2626; color:#fff; border:none; border-radius:10px;
        padding:10px 16px; font-size:16px; font-weight:800;}
      .uj-empty{color:#64748b; text-align:center; padding:16px; font-size:15px;}
      .shot-box{position:relative; width:100%; height:210px; border-radius:14px;
        border:2px dashed var(--line); background:#0d141d;
        display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;}
      .shot-box:active{border-color:var(--mint);}
      /* 업로드 상태 색 띠(박스 바깥) — 올리는중 노랑 / 저장됨 초록 / 실패 빨강 */
      .shot-box.uup{box-shadow:0 0 0 4px var(--amber); border-color:var(--amber);}
      .shot-box.uok{box-shadow:0 0 0 4px var(--mint); border-color:var(--mint);}
      .shot-box.ufail{box-shadow:0 0 0 4px var(--red); border-color:var(--red);}
      .shot-box .hint{font-size:19px; color:var(--ink-2); font-weight:700; text-align:center; line-height:1.5;}
      .shot-box img{width:100%; height:100%; object-fit:cover; display:none;}
      .shot-box.has img{display:block;}
      .shot-box.has .hint{display:none;}
      .shot-box .badge{position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,.62);
        color:#fff; font-size:15px; font-weight:800; padding:8px 14px; border-radius:10px; display:none;}
      .shot-box.has .badge{display:block;}
      .shot-box .spin{position:absolute; inset:0; background:rgba(0,0,0,.45);
        display:none; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#fff;}
      .shot-box.busy .spin{display:flex;}

      .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
        align-items:flex-end; justify-content:center; z-index:50;}
      .sheet-bg.open{display:flex;}
      .sheet{width:100%; max-width:520px; background:var(--card);
        border-radius:22px 22px 0 0; border-top:1px solid var(--line);
        padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
      .sheet h3{margin:4px 0 16px; text-align:center; font-size:20px; font-weight:800;}
      .sheet-btn{width:100%; min-height:74px; font-size:23px; font-weight:800;
        border:none; border-radius:16px; margin-bottom:12px; cursor:pointer;}
      .sheet-cam{background:var(--mint); color:#04130d;}
      .sheet-alb{background:var(--btn); color:var(--ink); border:2px solid var(--line);}
      .sheet-cancel{background:transparent; color:var(--ink-2); min-height:56px; font-size:18px;}
      .sheet-btn:active{transform:scale(.98);}
      .hidden-input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}

      .login-bg{position:fixed; inset:0; background:var(--bg); z-index:100;
        display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
      .login-bg.hide{display:none;}
      .login-bg h2{font-size:24px; font-weight:900; margin:0 0 24px;}
      .login-bg input{width:100%; max-width:360px; min-height:62px; font-size:20px;
        background:var(--card); border:2px solid var(--line); border-radius:14px;
        color:var(--ink); padding:0 16px; margin-bottom:14px;}
      .login-bg button{width:100%; max-width:360px; min-height:66px; font-size:22px; font-weight:800;
        background:var(--mint-d); color:#04130d; border:none; border-radius:14px; cursor:pointer;}
      .login-err{color:var(--red); font-size:16px; font-weight:700; min-height:22px; margin-bottom:10px;}

      .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
        background:#000c; color:#fff; font-size:17px; font-weight:700; padding:12px 20px;
        border-radius:12px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60;}
      .toast.show{opacity:1;}

      /* 설정(톱니) 버튼 — 새로고침 옆 */
      .gear{background:var(--btn); border:1px solid var(--line); color:var(--ink);
        font-size:15px; font-weight:700; padding:8px 14px; border-radius:10px; cursor:pointer; margin-left:8px;}

      /* 옵션 화면 (전체) */
      .opt-bg{position:fixed; inset:0; background:var(--bg); z-index:90; display:none;
        flex-direction:column; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y:auto;}
      .opt-bg.open{display:flex;}
      .opt-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
      .opt-head h2{font-size:22px; font-weight:900; margin:0;}
      .opt-close{background:var(--btn); border:1px solid var(--line); color:var(--ink);
        font-size:17px; font-weight:800; padding:10px 18px; border-radius:12px; cursor:pointer;}
      .opt-row{display:flex; align-items:center; justify-content:space-between; gap:12px;
        background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 16px; margin-bottom:12px;}
      .opt-row .label{font-size:20px; font-weight:800;}
      .opt-row .desc{font-size:14px; color:var(--ink-2); font-weight:600; margin-top:4px;}
      .sw{flex:0 0 auto; width:74px; height:42px; border-radius:21px; background:var(--btn);
        border:2px solid var(--line); position:relative; cursor:pointer; transition:background .15s;}
      .sw .knob{position:absolute; top:3px; left:3px; width:32px; height:32px; border-radius:50%;
        background:var(--ink-2); transition:left .15s, background .15s;}
      .sw.on{background:var(--mint-d); border-color:var(--mint-d);}
      .sw.on .knob{left:35px; background:#04130d;}

      /* 철거지침 입력 (옵션 ON 시) */
      .reading{margin-top:12px; display:none;}
      .reading.show{display:block;}
      .reading label{font-size:17px; font-weight:800; color:var(--ink-2); display:block; margin-bottom:8px;}
      .reading input{width:100%; min-height:64px; font-size:30px; font-weight:900; letter-spacing:.04em;
        text-align:center; background:#0d141d; border:2px solid var(--line); border-radius:14px;
        color:var(--ink); padding:0 14px;}
      .reading .yolo-tag{font-size:14px; font-weight:700; color:var(--mint); margin-top:6px; min-height:18px;}

      /* QR 버튼 (옵션 ON 시) */
      .qr-row{display:none; margin-bottom:14px;}
      .qr-row.show{display:block;}
      .qr-btn{width:100%; min-height:66px; font-size:21px; font-weight:800; cursor:pointer;
        background:var(--btn); color:var(--ink); border:2px solid var(--mint-d); border-radius:16px;}
      .qr-btn:active{transform:scale(.98);}
      .qr-result{text-align:center; font-size:17px; font-weight:800; color:var(--mint); margin-top:8px; min-height:20px;}

      /* 숫자 키패드 모달 (삼성 WebView가 inputmode 무시 → 자체 키패드, 어르신 큰 UI) */
      .kp-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
        align-items:flex-end; justify-content:center; z-index:80;}
      .kp-bg.open{display:flex;}
      .kp{width:100%; max-width:520px; background:var(--card);
        border-radius:22px 22px 0 0; border-top:1px solid var(--line);
        padding:16px 14px calc(16px + env(safe-area-inset-bottom));}
      .kp-title{text-align:center; font-size:18px; font-weight:800; color:var(--ink-2); margin-bottom:10px;}
      .kp-display{min-height:66px; font-size:38px; font-weight:900; text-align:center; letter-spacing:.05em;
        background:#0d141d; border:2px solid var(--line); border-radius:14px; color:var(--ink);
        display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
      .kp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
      .kp-key{min-height:70px; font-size:30px; font-weight:900; background:var(--btn); color:var(--ink);
        border:2px solid var(--line); border-radius:14px; cursor:pointer; user-select:none;}
      .kp-key:active{background:var(--btn-press); transform:scale(.97);}
      .kp-key.ok{background:var(--mint-d); color:#04130d; border-color:var(--mint-d);}
      .kp-key.del{background:#3a2630; color:var(--red); border-color:#5a3340;}
    </style>
</head>
<body>
    <div class="login-bg" id="login">
        <h2>종로 사진 보조</h2>
        <input type="text" id="lg-id" placeholder="아이디" autocomplete="username" autocapitalize="none">
        <input type="password" id="lg-pw" placeholder="비밀번호" autocomplete="current-password">
        <div class="login-err" id="lg-err"></div>
        <button id="lg-btn">로그인</button>
    </div>

    <div class="top">
        <span class="who" id="who">-</span>
        <span>
          <span class="refresh" id="refresh">새로고침</span>
          <span class="gear" id="gear">설정</span>
          <span class="gear" id="logout">로그아웃</span>
        </span>
    </div>

    <!-- 옵션 화면 -->
    <div class="opt-bg" id="opt">
        <div class="opt-head">
            <h2>설정</h2>
            <button class="opt-close" id="opt-close">닫기</button>
        </div>
        <div class="opt-row">
            <div>
                <div class="label">철거 검침값 입력</div>
                <div class="desc">철거 사진 아래 검침값(숫자) 칸을 켭니다</div>
            </div>
            <div class="sw" id="sw-reading" data-opt="reading"><span class="knob"></span></div>
        </div>
        <div class="opt-row">
            <div>
                <div class="label">QR 스캔(신계기)</div>
                <div class="desc">새 계기 QR로 계기번호·제조월을 함께 보냅니다</div>
            </div>
            <div class="sw" id="sw-qr" data-opt="qr"><span class="knob"></span></div>
        </div>
        <div class="opt-row">
            <div>
                <div class="label">LCD 자동검출(YOLO)</div>
                <div class="desc">철거 사진의 계기판 위치를 자동으로 잡습니다</div>
            </div>
            <div class="sw" id="sw-yolo" data-opt="yolo"><span class="knob"></span></div>
        </div>
    </div>

    <!-- 철거 사진 -->
    <div class="shot">
        <div class="shot-title">철거 사진 <span class="shot-status" id="st-old"></span></div>
        <div class="shot-box" id="box-old" data-slot="old">
            <span class="hint">탭해서 사진 넣기</span>
            <img id="img-old" alt="철거 사진">
            <span class="badge" id="bd-old"></span>
            <div class="spin">저장 중...</div>
        </div>
        <!-- 철거 검침값 (옵션) -->
        <div class="reading" id="reading-wrap">
            <label>철거 검침값 (kWh)</label>
            <input type="text" id="reading-val" inputmode="numeric" placeholder="예: 12345">
            <div class="yolo-tag" id="yolo-tag"></div>
        </div>
    </div>

    <!-- 신설 사진 -->
    <div class="shot">
        <div class="shot-title">신설 사진 <span class="shot-status" id="st-new"></span></div>
        <!-- QR (옵션) -->
        <div class="qr-row" id="qr-row">
            <button class="qr-btn" id="qr-btn">QR 스캔 (새 계기)</button>
            <div class="qr-result" id="qr-result"></div>
        </div>
        <div class="shot-box" id="box-new" data-slot="new">
            <span class="hint">탭해서 사진 넣기</span>
            <img id="img-new" alt="신설 사진">
            <span class="badge" id="bd-new"></span>
            <div class="spin">저장 중...</div>
        </div>
    </div>

    <!-- 작업번호 (저장 위치) -->
    <div class="seq-wrap">
        <div class="seq-label">작업번호</div>
        <div class="seq-row">
            <div class="seq-btn" id="seq-prev">이전</div>
            <div class="seq-num" id="seq-num">1</div>
            <div class="seq-btn" id="seq-next">다음</div>
        </div>
        <div class="seq-meter" id="seq-meter"><span class="none">계기 미할당 (보관 후 자동 연결)</span></div>
    </div>

    <div class="sheet-bg" id="sheet">
        <div class="sheet">
            <h3 id="sheet-title">사진 추가</h3>
            <button class="sheet-btn sheet-cam" id="sheet-cam">촬영</button>
            <button class="sheet-btn sheet-alb" id="sheet-alb">앨범</button>
            <button class="sheet-btn sheet-cancel" id="sheet-cancel">취소</button>
        </div>
    </div>

    <input class="hidden-input" type="file" accept="image/*" capture="environment" id="in-cam">
    <input class="hidden-input" type="file" accept="image/*" id="in-alb">

    <!-- QR 스캔 오버레이 (map.html과 동일 — qr-scanner.js가 이 DOM 사용) -->
    <div id="qr-scan-overlay" style="display:none;position:fixed;inset:0;background:black;z-index:3000;flex-direction:column;">
      <div style="display:flex;align-items:center;padding:10px 14px;background:#111;color:white;gap:8px;">
        <span id="qr-cam-label" style="font-size:12px;font-weight:600;white-space:nowrap;">카메라</span>
        <select id="qr-cam-select" style="flex:1;min-width:140px;padding:8px 10px;background:#374151;color:white;border:1.5px solid #6b7280;border-radius:6px;font-size:13px;font-weight:600;appearance:auto;-webkit-appearance:auto;"><option>카메라 로드 중...</option></select>
        <button id="qr-close-btn" style="padding:6px 12px;background:#ef4444;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;">×</button>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;background:black;overflow:hidden;">
        <div id="qr-reader" style="width:min(100vw, 100%); aspect-ratio:1/1; max-height:100%; background:black; position:relative; overflow:hidden;"></div>
      </div>
      <div id="qr-error-msg" style="display:none;padding:14px;background:#7f1d1d;color:white;font-size:13px;text-align:center;"></div>
      <div style="display:flex;gap:6px;padding:8px;background:#111;">
        <button id="qr-switch-btn" style="display:none;flex:1;padding:10px;background:#374151;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;">카메라 전환</button>
        <button id="qr-zoom-out" style="flex:1;padding:10px;background:#374151;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;">- 줌</button>
        <button id="qr-zoom-in" style="flex:1;padding:10px;background:#374151;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;">+ 줌</button>
        <button id="qr-torch-btn" style="display:none;flex:1;padding:10px;background:#374151;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;">손전등</button>
      </div>
    </div>

    <div style="text-align:center; font-size:13px; font-weight:700; color:#5a6b7d; padding:8px 0 4px; letter-spacing:.03em;">종로 보조앱 v20260616.1</div>

    <!-- 업로드 현황 도크 (하단 고정) -->
    <div class="uj-dock" id="uj-dock">
      <div class="uj-panel" id="uj-panel"><div class="uj-list-inner" id="uj-list"></div></div>
      <div class="uj-bar" id="uj-bar">
        <span id="uj-summary">업로드 없음</span>
        <span class="uj-tog" id="uj-tog">▲ 현황</span>
      </div>
    </div>

    <!-- 숫자 키패드 (검침값 입력) -->
    <div class="kp-bg" id="kp">
        <div class="kp">
            <div class="kp-title">철거 검침값 (kWh)</div>
            <div class="kp-display" id="kp-display">0</div>
            <div class="kp-grid">
                <button class="kp-key" data-k="1">1</button>
                <button class="kp-key" data-k="2">2</button>
                <button class="kp-key" data-k="3">3</button>
                <button class="kp-key" data-k="4">4</button>
                <button class="kp-key" data-k="5">5</button>
                <button class="kp-key" data-k="6">6</button>
                <button class="kp-key" data-k="7">7</button>
                <button class="kp-key" data-k="8">8</button>
                <button class="kp-key" data-k="9">9</button>
                <button class="kp-key del" data-k="del">지움</button>
                <button class="kp-key" data-k="0">0</button>
                <button class="kp-key ok" data-k="ok">확인</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const $ = id => document.getElementById(id);

      // ── Firebase (ami-jongno 공유) ──
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const statusRef = db.ref('workStatus/jongno');
      const tempRef   = db.ref('tempPhotos/jongno');

      function dayKST(){
        return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul',
          year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
      }
      function msToDayKST(ms){
        return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul',
          year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(ms));
      }

      let session = null;
      let seq = 1;
      let usedSeqs = new Set();   // 오늘 이미 쓰인 작업번호(계기할당 + 임시보관)
      let seqIndex = {};          // 작업번호 → {addr, meterId, entry} (이미 계기 할당된 것)
      let tempIndex = {};         // 작업번호 → temp 보관 {removal_photo, new_meter_photo}

      // ── 자체 로그인 ──
      function showLogin(){ $('login').classList.remove('hide'); }
      function hideLogin(){ $('login').classList.add('hide'); }
      function doLogin(){
        const r = authLogin($('lg-id').value.trim(), $('lg-pw').value);
        if (r.ok){ startApp(); }
        else { $('lg-err').textContent = r.error || '로그인 실패'; $('lg-pw').value=''; $('lg-pw').focus(); }
      }
      $('lg-btn').onclick = doLogin;
      $('lg-pw').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
      // 로그아웃 — 세션 비우고 로그인 화면으로 (아이디 전환용). 데이터는 아이디 무관 공유라 누구로 재로그인해도 동일.
      $('logout').onclick = () => {
        authLogout(); session = null;
        $('lg-id').value = ''; $('lg-pw').value = ''; $('lg-err').textContent = '';
        showLogin();
      };

      async function startApp(){
        session = authGetSession();
        $('who').textContent = session ? (session.name || session.id) : '-';
        hideLogin();
        await loadToday();
        seq = nextEmptySeq();
        renderSeq();
        ujSweep();    // 앱 시작 시 orphan(done/묵은) job 노드 정리
        ujRender();   // 업로드 현황 도크 초기 표시
      }

      // ── 오늘 데이터 로드: 작업번호별 계기/보관 인덱싱 + 빈번호 계산 ──
      async function loadToday(){
        const today = dayKST();
        usedSeqs = new Set(); seqIndex = {}; tempIndex = {};
        try {
          const snap = await statusRef.once('value');
          const ws = snap.val() || {};
          for (const addr in ws){
            const rl = ws[addr] && ws[addr].replacement_list;
            if (!rl) continue;
            for (const mid in rl){
              const r = rl[mid];
              if (!r || typeof r.replaced_at !== 'number') continue;
              if (msToDayKST(r.replaced_at) !== today) continue;       // 오늘 것만
              if (typeof r.daily_seq === 'number'){
                usedSeqs.add(r.daily_seq);
                seqIndex[r.daily_seq] = { addr, meterId: r.old_meter_id || mid, entry: r };
              }
            }
          }
          // 임시보관함(사진만, 계기 미할당)도 번호 점유
          const tsnap = await tempRef.child(today).once('value');
          const tv = tsnap.val() || {};
          for (const s in tv){ usedSeqs.add(Number(s)); tempIndex[Number(s)] = tv[s]; }
        } catch(e){ console.error('[loadToday]', e); toast('데이터 로드 실패 — 새로고침'); }
      }

      function nextEmptySeq(){
        let max = 0; usedSeqs.forEach(n => { if (n > max) max = n; });
        for (let i=1; i<=max; i++){ if (!usedSeqs.has(i)) return i; }
        return max + 1;
      }

      // ── 작업번호 표시 + 그 번호의 슬롯을 "선언적으로" 재구성 ──
      // 슬롯은 항상 slotView(seq,slot)의 진실로 다시 그린다 → 잔상/비동기 충돌이 구조적으로 불가능.
      function renderSeq(){
        $('seq-num').textContent = seq;
        const hit = seqIndex[seq];
        const tmp = tempIndex[seq];
        const m = $('seq-meter');
        if (hit){
          m.innerHTML = '<span class="no">계기 ' + hit.meterId + ' (할당됨)</span>';
        } else if (tmp){
          m.innerHTML = '<span class="none">보관 중 (계기 미할당)</span>';
        } else {
          m.innerHTML = '<span class="none">계기 미할당 (보관 후 자동 연결)</span>';
        }
        paintSlot('old', slotView(seq, 'old'));
        paintSlot('new', slotView(seq, 'new'));
        renderSeqExtras(seq);  // 검침값/QR/YOLO 부가 입력 복원(옵션 ON시)
      }
      function photoFromRemoval(entry){
        const rp = entry.removal_photos;
        if (rp && typeof rp === 'object'){ const k = Object.keys(rp)[0]; if (k) return rp[k]; }
        return null;
      }
      // RTDB에 확정 저장된 사진 URL (없으면 null)
      function rtdbPhotoFor(seqNo, slot){
        const hit = seqIndex[seqNo], tmp = tempIndex[seqNo];
        if (slot === 'old') return (hit && (hit.entry.old_meter_photo || photoFromRemoval(hit.entry))) || (tmp && tmp.removal_photo) || null;
        return (hit && hit.entry.new_meter_photo) || (tmp && tmp.new_meter_photo) || null;
      }
      function jobTs(id){ const m = String(id).match(/_(\d+)$/); return m ? Number(m[1]) : 0; }
      // 그 작업번호/슬롯의 단일 진실: 진행중 job 우선(최신 1개), 없으면 RTDB 확정사진, 둘 다 없으면 빈칸
      function slotView(seqNo, slot){
        let best = null, bestTs = -1;
        for (const id in _ujJobs){
          const j = _ujJobs[id];
          if (j.seq === seqNo && j.slot === slot){ const t = jobTs(id); if (t > bestTs){ bestTs = t; best = j; } }
        }
        const rtdbUrl = rtdbPhotoFor(seqNo, slot);
        if (best){
          if (best.status === 'up')   return { status:'up',   img: best.img || rtdbUrl };
          if (best.status === 'fail') return { status:'fail', img: best.img || rtdbUrl };
          return { status:'ok', img: best.img || rtdbUrl };   // ok: 원격URL 우선, 없으면 RTDB
        }
        return rtdbUrl ? { status:'ok', img: rtdbUrl } : null;
      }
      // 슬롯 DOM을 v(=slotView 결과)대로 그림. v=null이면 빈칸. 매 호출이 그 번호의 정답으로 덮음(지울 필요 없음).
      function paintSlot(slot, v){
        const box = $('box-'+slot), img = $('img-'+slot), st = $('st-'+slot), bd = $('bd-'+slot);
        box.classList.remove('uup','uok','ufail');   // 상태 색 띠 초기화
        if (!v){
          img.removeAttribute('src'); box.classList.remove('has','busy');
          st.textContent = ''; st.className = 'shot-status'; bd.textContent = ''; return;
        }
        if (v.img){ img.src = v.img; box.classList.add('has'); } else { img.removeAttribute('src'); box.classList.remove('has'); }
        box.classList.toggle('busy', v.status === 'up');   // '올리는 중'일 때만 스피너
        bd.textContent = seq + '번';
        if (v.status === 'up'){ st.textContent = '올리는 중'; st.className = 'shot-status saving'; box.classList.add('uup'); }
        else if (v.status === 'fail'){ st.textContent = '저장 실패'; st.className = 'shot-status err'; box.classList.add('ufail'); }
        else { st.textContent = '저장됨'; st.className = 'shot-status saved'; box.classList.add('uok'); }
      }

      $('seq-prev').onclick = () => { if (seq > 1) seq--; renderSeq(); };
      $('seq-next').onclick = () => { seq++; renderSeq(); };
      $('refresh').onclick = async () => { await loadToday(); renderSeq(); toast('새로고침 완료'); };

      // ── 팝업 ──
      let sheetSlot = null;
      function openSheet(slot){
        sheetSlot = slot;
        $('sheet-title').textContent = (slot==='old' ? '철거' : '신설') + ' 사진';
        $('sheet').classList.add('open');
      }
      function closeSheet(){ $('sheet').classList.remove('open'); }

      // ── 업로드 현황 도크 (하단 고정 요약 바 + 펼침 리스트) ──
      // jobId 키 전역 패널 → 작업번호 전환 race에 면역(슬롯 표시는 보조).
      const _ujJobs = {};   // jobId → {seq, slot, status('up'|'ok'|'fail'), img(로컬blob 또는 원격URL), ref}
      function ujLabel(slot){ return slot === 'old' ? '철거사진' : '신설사진'; }
      // 사진 선택 시 등록(올리는중) + 워커 종착상태(done/failed) 구독. img=로컬 objectURL(즉시 미리보기용).
      function ujRegister(jobId, seqNo, slot, img){
        _ujJobs[jobId] = { seq: seqNo, slot, status: 'up', img: img || null, ref: null };
        ujRender();
        try {
          const ref = db.ref('uploadJobs/jongno/' + jobId);
          _ujJobs[jobId].ref = ref;
          ref.on('value', sn => {
            const val = sn.val(); const st = val && val.status;
            if (st === 'done'){ ujSet(jobId, 'ok', val.url); ref.off(); ref.remove().catch(()=>{}); }
            else if (st === 'failed'){ ujSet(jobId, 'fail'); ref.off(); }
          });
        } catch(e){ console.warn('[uj 구독 실패]', e); }
      }
      function ujSet(jobId, status, remoteUrl){
        const j = _ujJobs[jobId]; if (!j) return;
        // ok 전환 시 로컬 blob 회수 + 원격 URL로 교체(메모리 누수 방지 — 슬롯은 RTDB/원격URL로 그림)
        if (status === 'ok' && j.img && String(j.img).startsWith('blob:')){
          URL.revokeObjectURL(j.img); j.img = remoteUrl || null;
        }
        j.status = status; j.hidden = false; ujRender();
        if (seq === j.seq) renderSeq();   // 현재 보는 번호면 슬롯도 선언적으로 재렌더
        // 성공 항목은 1분 뒤 도크 리스트에서 자동 숨김(슬롯의 '저장됨'은 RTDB/원격URL로 그대로 유지).
        // 실패는 숨기지 않음 — 재전송할 때까지 남는다.
        if (status === 'ok'){
          clearTimeout(j._t);
          j._t = setTimeout(() => { j.hidden = true; ujRender(); }, 60000);
        }
      }
      function ujRemove(jobId){
        const j = _ujJobs[jobId]; if (!j) return;
        if (j.ref) j.ref.off();
        clearTimeout(j._t);
        if (j.img && String(j.img).startsWith('blob:')) URL.revokeObjectURL(j.img);
        delete _ujJobs[jobId]; ujRender();
      }
      function ujRender(){
        const list = $('uj-list'), bar = $('uj-bar'), sum = $('uj-summary');
        const arr = Object.entries(_ujJobs).filter(([,j]) => !j.hidden).sort((a,b) => (b[1].seq - a[1].seq));
        let up = 0, ok = 0, fail = 0;
        arr.forEach(([,j]) => { if (j.status==='up') up++; else if (j.status==='ok') ok++; else if (j.status==='fail') fail++; });
        bar.classList.toggle('has-fail', fail > 0);
        bar.classList.toggle('all-ok', fail === 0 && up === 0 && ok > 0);
        const parts = [];
        if (up) parts.push('올리는 중 ' + up);
        if (ok) parts.push('성공 ' + ok);
        if (fail) parts.push('실패 ' + fail);
        sum.textContent = parts.length ? parts.join(' · ') : '업로드 없음';
        if (!arr.length){ list.innerHTML = '<div class="uj-empty">아직 업로드한 사진이 없습니다</div>'; return; }
        list.innerHTML = '';
        arr.forEach(([id,j]) => {
          const row = document.createElement('div');
          row.className = 'uj-item ' + j.status;
          const state = j.status==='up' ? '올리는 중' : j.status==='ok' ? '성공' : '실패';
          const lbl = document.createElement('span');
          lbl.className = 'lbl'; lbl.textContent = j.seq + '번 ' + ujLabel(j.slot) + ' — ' + state;
          row.appendChild(lbl);
          if (j.status === 'fail'){
            const btn = document.createElement('button');
            btn.className = 'uj-retry'; btn.textContent = '재전송';
            btn.onclick = () => ujRetry(id);
            row.appendChild(btn);
          }
          list.appendChild(row);
        });
      }
      function ujRetry(jobId){
        const j = _ujJobs[jobId]; if (!j) return;
        if (j.ref) j.ref.off();
        try { db.ref('uploadJobs/jongno/' + jobId).remove().catch(()=>{}); } catch(e){}
        ujRemove(jobId);
        seq = j.seq; renderSeq();         // 그 작업번호로 이동
        sheetSlot = j.slot;
        $('uj-panel').classList.remove('open');
        $('in-alb').click();              // 갤러리(Pictures/종로사진실패 포함)에서 재선택
        toast(j.seq + '번 ' + ujLabel(j.slot) + ' 재전송 — 갤러리에서 사진 선택');
      }
      // 앱 시작 시 orphan job 노드 정리(앱이 죽어 리스너 detach 못한 done/묵은 노드)
      async function ujSweep(){
        try {
          const sn = await db.ref('uploadJobs/jongno').once('value');
          const v = sn.val(); if (!v) return;
          const now = Date.now();
          for (const [id, job] of Object.entries(v)){
            const stale = job.done_at && (now - job.done_at > 6*3600*1000);
            if (job.status === 'done' || stale) db.ref('uploadJobs/jongno/' + id).remove().catch(()=>{});
          }
        } catch(e){ console.warn('[uj sweep 실패]', e); }
      }
      $('uj-bar').onclick = () => $('uj-panel').classList.toggle('open');
      $('box-old').onclick = () => openSheet('old');
      $('box-new').onclick = () => openSheet('new');
      $('sheet-cancel').onclick = closeSheet;
      $('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };
      $('sheet-cam').onclick = () => { closeSheet(); $('in-cam').click(); };
      $('sheet-alb').onclick = () => { closeSheet(); $('in-alb').click(); };

      function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
        clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 1800); }

      // ── 사진 선택 → job 등록(올리는중) + 자동 저장. 표시는 전적으로 renderSeq(선언적)가 담당 ──
      async function onPick(slot, file){
        if (!file) return;
        const localSeq = seq;
        // ★삼성 파일피커 content:// 파일은 createImageBitmap 여러 번 호출 시 디코드 실패(종로맵과 동일).
        //   메모리 Blob으로 1회 materialize → compress·detect·박스그리기 모두 이 mem 재사용(YOLO 못찾던 원인).
        let mem = file;
        try { mem = new Blob([await file.arrayBuffer()], { type: file.type || 'image/jpeg' }); }
        catch(e){ console.warn('[materialize 실패, 원본 사용]', e); }
        const localUrl = URL.createObjectURL(mem);
        const jobId = `${dayKST()}_${localSeq}_${slot}_${Date.now()}`;
        ujRegister(jobId, localSeq, slot, localUrl);   // '올리는 중' 등록 + 워커 구독
        if (seq === localSeq) renderSeq();             // 즉시 미리보기(선언적 — 직접 DOM 조작 안 함)
        try {
          await autoSave(slot, mem, localSeq, jobId);
          // 상태 전이는 전부 job 모델로: 네이티브=워커 구독, 폴백=autoSave가 ujSet('ok'). 여기선 DOM 안 건드림.
          if (slot === 'old' && _opt.yolo) runYoloOnOld(mem, localSeq);  // 철거 LCD 자동검출(옵션, 비동기)
          await loadToday();                 // RTDB 반영(번호 점유)
          if (seq === localSeq) renderSeq();
        } catch (e) {
          console.error('[autoSave]', e);
          ujSet(jobId, 'fail');              // 즉시 오류 → 실패(도크+슬롯 자동 반영)
          alert('저장 실패 원인:\n' + ((e && e.code) ? e.code + '\n' : '') + ((e && e.message) ? e.message : String(e)));
        }
      }
      $('in-cam').onchange = e => { const f=e.target.files[0]; e.target.value=''; if(sheetSlot) onPick(sheetSlot, f); };
      $('in-alb').onchange = e => { const f=e.target.files[0]; e.target.value=''; if(sheetSlot) onPick(sheetSlot, f); };

      // ── 부모-자식 우선 규칙 헬퍼 (폴백 SDK 경로 전용) ──
      // 필드에 이미 값이 있으면 건너뛰고, 비었을 때만 set. 종로맵(부모앱)이 넣은 데이터를 보호.
      // ref: Firebase Database Reference, url: 저장할 값, label: 로그/toast용 필드명.
      async function setIfEmpty(ref, url, label){
        const snap = await ref.once('value');
        if (snap.val() != null){
          // 이미 값 있음 — 종로맵이 넣은 것으로 간주하고 덮지 않음
          console.info('[snap 보호] 이미 값 있음, 건너뜀:', label);
          toast('종로앱에 이미 입력됨 — 건너뜀 (' + label + ')');
          return;
        }
        await ref.set(url);
      }

      // ── Storage 업로드: Capacitor의 XHR shim이 Firebase SDK put()을 깨뜨림(storage/unknown 400).
      //   압축은 SDK(canvas, XHR 무관)로, 업로드는 raw REST로 우회(CDP에서 200 검증됨).
      async function restUpload(blob, path){
        const bucket = firebaseConfig.storageBucket;
        const up = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o?uploadType=media&name=${encodeURIComponent(path)}`;
        // ★Capacitor native-bridge convertBody는 Blob/ArrayBuffer를 어느 분기에도 못 잡아
        //   { data: body, type:'json' }로 떨어뜨림 → 네이티브가 JSON.stringify(Blob)='{}' 전송 →
        //   서버엔 2바이트 '{}'가 image/jpeg로 저장돼 종로 모달서 깨진 사진('?')으로 뜸.
        //   convertBody가 바이너리를 무손실(readFileAsBase64) 처리하는 유일한 타입 = File. 그래서 File로 감쌈.
        const fileBody = (blob instanceof File) ? blob : new File([blob], 'photo.jpg', { type: 'image/jpeg' });
        const res = await fetch(up, { method:'POST', headers:{'Content-Type':'image/jpeg'}, body: fileBody });
        if (!res.ok) throw new Error('storage ' + res.status);
        const d = await res.json();
        // 업로드 검증(fail-loud): 저장 크기가 보낸 크기와 다르면(예: '{}' 2바이트) 실패로 처리.
        //   조용히 깨진 URL을 저장해 며칠 뒤 '?'로 발견되는 일 방지.
        if (d.size != null && fileBody.size && Math.abs(Number(d.size) - fileBody.size) > 16) {
          throw new Error('업로드 손상: 보낸 ' + fileBody.size + 'B → 저장 ' + d.size + 'B');
        }
        const tok = d.downloadTokens ? String(d.downloadTokens).split(',')[0] : '';
        return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(path)}?alt=media&token=${tok}`;
      }

      // ── 자동 저장: 계기 할당됐으면 그 계기에 직접, 아니면 임시보관함 ──
      // 네이티브(AndroidUpload) 브릿지가 있으면 WorkManager 큐 등록(백그라운드, 자동재시도).
      // 브릿지 없으면(웹 브라우저/구버전) 기존 restUpload + Firebase SDK 방식으로 폴백.
      async function autoSave(slot, file, s, jobId){
        // ★staleness 픽스: 저장 직전 최신 할당을 다시 받아 hit 판정 — 종로 메인앱에서 방금 할당(교체)한
        //   계기도 인식해 temp로 새지 않고 그 계기에 직접 저장한다. (onPick 끝 loadToday는 한 박자 늦음)
        try { await loadToday(); } catch(e){ console.warn('[autoSave loadToday]', e); }
        const day = dayKST();
        const hit = seqIndex[s];
        const path = hit
          ? `replacements/${hit.addr}/${hit.meterId}_${Date.now()}/${slot}.jpg`
          : `replacements/_temp/${day}/${s}/${slot}.jpg`;

        // ── 네이티브 WorkManager 경로 ──
        if (typeof AndroidUpload !== 'undefined' && AndroidUpload.available()) {
          const blob = await PhotoUploader.compress(file, { square:false });
          // Blob → base64 변환 (브릿지 전달용)
          const b64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              // data:image/jpeg;base64,XXXX 에서 XXXX 부분만 추출
              const result = reader.result;
              const comma = result.indexOf(',');
              resolve(comma >= 0 ? result.slice(comma + 1) : result);
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });

          // RTDB PATCH ops 구성 — body 내 URL 자리는 __UPLOAD_URL__ 플레이스홀더
          // 워커가 업로드 완료 후 실제 URL로 치환
          let rtdbOps;
          if (hit){
            // 시나리오 A: 할당된 계기에 직접
            // addr(한글/공백)·meterId를 인코딩 — 워커가 new URL(DATABASE_URL+path) 시 깨지지 않게.
            // Firebase RTDB는 URL을 디코드한 값을 키로 저장하므로 기존 한글 키와 정확히 매칭된다.
            const base = `/workStatus/jongno/${encodeURIComponent(hit.addr)}/replacement_list/${encodeURIComponent(hit.meterId)}`;
            if (slot === 'old'){
              // 부모-자식 우선 규칙: ifEmpty:true + check 필드(필드 경로)로 워커가 PATCH 전 GET 검사.
              // PATCH 경로(removal_photos.json) 전체를 GET 하면 다른 칸이 채워진 경우 오skip 위험 — 필드 경로 직접 명시.
              rtdbOps = [
                { path: `${base}/removal_photos.json`,  body: { whme_day: '__UPLOAD_URL__' },
                  ifEmpty: true, check: `${base}/removal_photos/whme_day.json` },
                { path: `${base}.json`,                 body: { old_meter_photo: '__UPLOAD_URL__' },
                  ifEmpty: true, check: `${base}/old_meter_photo.json` }
              ];
            } else {
              rtdbOps = [
                { path: `${base}.json`, body: { new_meter_photo: '__UPLOAD_URL__' },
                  ifEmpty: true, check: `${base}/new_meter_photo.json` }
              ];
            }
          } else {
            // 시나리오 B: 임시보관함
            const field = (slot === 'old') ? 'removal_photo' : 'new_meter_photo';
            const tempPath = `/tempPhotos/jongno/${encodeURIComponent(day)}/${encodeURIComponent(String(s))}.json`;
            rtdbOps = [
              { path: tempPath, body: {
                [field]: '__UPLOAD_URL__',
                daily_seq: s,
                worker: session ? session.id : '',
                worker_name: session ? (session.name || '') : '',
                // 워커는 Firebase SDK 없이 REST PATCH — {".sv":"timestamp"} 리터럴 사용
                updated_at: { '.sv': 'timestamp' }
              }}
            ];
          }

          const queued = AndroidUpload.enqueue(b64, path, JSON.stringify(rtdbOps), jobId);
          if (queued) {
            // 큐 등록 성공 — 업로드는 백그라운드에서 진행. 상태는 onPick이 등록한 job 구독(done/failed)으로 갱신.
            return '업로드 대기열 등록됨';
          }
          // enqueue 실패 — 워커가 돌지 않으니 구독 해제 후 폴백(폴백 끝에서 ujSet('ok'))
          { const j = _ujJobs[jobId]; if (j && j.ref){ j.ref.off(); j.ref = null; } }
          console.warn('[AndroidUpload.enqueue 실패] restUpload 폴백 진행');
        }

        // ── 폴백: 기존 restUpload + Firebase SDK 경로 (웹 브라우저, 구버전 앱, enqueue 실패) ──
        const blob = await PhotoUploader.compress(file, { square:false });
        const url = await restUpload(blob, path);
        if (hit){
          // 시나리오 A: 부모-자식 우선 규칙 — 필드에 이미 값이 있으면 건너뜀.
          // 종로맵(부모앱)이 넣은 데이터를 snap이 덮지 않는다.
          const node = statusRef.child(hit.addr).child('replacement_list').child(hit.meterId);
          if (slot === 'old'){
            // ★종로 모달은 removal_photos[칸] 우선 표시 → 대표를 whme_day 칸에 (old_meter_photo는 호환용)
            await setIfEmpty(node.child('removal_photos').child('whme_day'), url, 'removal_photos/whme_day');
            await setIfEmpty(node.child('old_meter_photo'), url, 'old_meter_photo');
          } else {
            await setIfEmpty(node.child('new_meter_photo'), url, 'new_meter_photo');
          }
        } else {
          // 시나리오 B: 임시보관함. 나중에 메인앱이 같은 번호에 계기 할당 시 결합
          const field = (slot==='old') ? 'removal_photo' : 'new_meter_photo';
          await tempRef.child(day).child(String(s)).update({
            [field]: url,
            daily_seq: s,
            worker: session ? session.id : '',
            worker_name: session ? (session.name||'') : '',
            updated_at: firebase.database.ServerValue.TIMESTAMP
          });
        }
        if (jobId) ujSet(jobId, 'ok', url);   // 폴백 경로(브라우저/구앱) 성공 — 원격 URL로 도크/슬롯 갱신
      }

      // ════════════ 옵션(설정) + 부가기능: 철거지침 / QR / YOLO ════════════
      const OPT_KEYS = { reading:'snap_opt_reading', qr:'snap_opt_qr', yolo:'snap_opt_yolo' };
      const _opt = { reading:false, qr:false, yolo:false };
      function loadOpts(){ for (const k in OPT_KEYS){ _opt[k] = localStorage.getItem(OPT_KEYS[k]) === '1'; } }
      function applyOpts(){
        $('reading-wrap').classList.toggle('show', _opt.reading);
        $('qr-row').classList.toggle('show', _opt.qr);
        $('sw-reading').classList.toggle('on', _opt.reading);
        $('sw-qr').classList.toggle('on', _opt.qr);
        $('sw-yolo').classList.toggle('on', _opt.yolo);
        if (_opt.yolo) loadYolo().then(()=>{ try{ LcdYolo.preload(); }catch(e){} });
      }
      $('gear').onclick = ()=> $('opt').classList.add('open');
      $('opt-close').onclick = ()=> $('opt').classList.remove('open');
      document.querySelectorAll('.sw[data-opt]').forEach(sw=>{
        sw.onclick = ()=>{
          const k = sw.dataset.opt; _opt[k] = !_opt[k];
          localStorage.setItem(OPT_KEYS[k], _opt[k] ? '1' : '0');
          applyOpts(); renderSeqExtras(seq);
        };
      });

      // YOLO 지연 로드 (ort + lcd-yolo) — 토글 ON 첫 1회만
      let _yoloLoading = null;
      function loadYolo(){
        if (typeof LcdYolo !== 'undefined') return Promise.resolve();
        if (_yoloLoading) return _yoloLoading;
        _yoloLoading = new Promise((res)=>{
          const add = (src, cb)=>{ const s=document.createElement('script'); s.src=src; s.onload=cb; s.onerror=cb; document.head.appendChild(s); };
          add('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js', ()=> add('js/lcd-yolo.js?v=snap-yolo', ()=> res()));
        });
        return _yoloLoading;
      }

      // temp 부가 데이터 저장 (항상 temp 노드 — 메인앱이 흡수, 빈칸만)
      async function saveTempExtra(s, fields){
        const day = dayKST();
        await tempRef.child(day).child(String(s)).update(Object.assign({
          daily_seq: s,
          worker: session ? session.id : '',
          worker_name: session ? (session.name||'') : '',
          updated_at: firebase.database.ServerValue.TIMESTAMP
        }, fields));
      }

      // 철거 검침값 입력 → temp.removal_value
      $('reading-val').addEventListener('change', async ()=>{
        const v = $('reading-val').value.trim();
        if (v === '') return;
        const localSeq = seq;
        try { await saveTempExtra(localSeq, { removal_value: Number(v) }); toast('검침값 저장됨 ('+localSeq+'번)'); }
        catch(e){ console.error('[검침값]', e); toast('검침값 저장 실패'); }
      });

      // 검침값 입력 = 자체 숫자 키패드 (삼성 WebView inputmode 무시 회피 + 어르신 큰 UI)
      $('reading-val').setAttribute('readonly', 'readonly');
      let _kpVal = '';
      function openKeypad(){
        _kpVal = String($('reading-val').value || '').replace(/[^0-9]/g, '');
        $('kp-display').textContent = _kpVal || '0';
        $('kp').classList.add('open');
      }
      function closeKeypad(save){
        $('kp').classList.remove('open');
        if (save){ $('reading-val').value = _kpVal; $('reading-val').dispatchEvent(new Event('change')); }
      }
      $('reading-val').onclick = openKeypad;
      $('kp').addEventListener('click', (e)=>{
        if (e.target === $('kp')){ closeKeypad(false); return; }   // 배경 탭 = 취소
        const k = e.target && e.target.dataset ? e.target.dataset.k : null;
        if (k == null) return;
        if (k === 'del') _kpVal = _kpVal.slice(0, -1);
        else if (k === 'ok'){ closeKeypad(true); return; }
        else if (_kpVal.length < 9) _kpVal += k;
        $('kp-display').textContent = _kpVal || '0';
      });

      // QR 스캔 → 신계기번호 + 제조월 → temp
      //   ★헬퍼앱과 동일하게 네이티브 구글 스캐너(GmsBarcodeScanner) 사용 = window.AndroidScanner.scan()
      //    결과는 네이티브가 window.__onNativeScan(rawValue) 호출(취소/실패=빈문자열). 브라우저는 웹 폴백.
      async function handleScanResult(raw, localSeq){
        if (!raw){ return; }  // 취소/실패
        // 메인앱과 동일: raw 그대로 parseValue (내부에서 * / 다중포맷 처리 — 임의 가공 금지)
        const parsed = (typeof parseValue === 'function') ? parseValue(String(raw)) : { value: raw, value2: '' };
        const meterId = String(parsed.value || '').slice(0,11);
        let mfg = ''; const v2 = String(parsed.value2 || '');
        if (/^\d{6}$/.test(v2)) mfg = v2.slice(0,4)+'-'+v2.slice(4,6);
        if (!meterId){ toast('QR 인식 실패'); return; }
        try {
          const f = { new_meter_id: meterId };
          if (mfg) f.new_meter_mfg_ym = mfg;
          await saveTempExtra(localSeq, f);
          $('qr-result').textContent = '새 계기 '+meterId+(mfg?(' / '+mfg):'');
          toast('계기번호 저장됨 ('+localSeq+'번)');
        } catch(e){ console.error('[QR저장]', e); toast('QR 저장 실패'); }
      }
      $('qr-btn').onclick = ()=>{
        const localSeq = seq;
        if (window.AndroidScanner && window.AndroidScanner.scan){
          // 네이티브 구글 스캐너(헬퍼와 동일)
          window.__onNativeScan = (raw)=>{ window.__onNativeScan = null; handleScanResult(raw, localSeq); };
          window.AndroidScanner.scan();
        } else if (typeof QrScanner !== 'undefined'){
          // 폴백(브라우저/개발) — 웹 스캐너
          QrScanner.show((raw)=>{ try{ QrScanner.stop(); }catch(e){} $('qr-scan-overlay').style.display='none'; handleScanResult(raw, localSeq); });
        } else { toast('스캐너 없음'); }
      };
      $('qr-close-btn').onclick = ()=>{ try{ QrScanner.stop(); }catch(e){} $('qr-scan-overlay').style.display='none'; };

      // YOLO: 철거 사진 선택 후 LCD 영역 검출 → temp.removal_lcd_region
      async function runYoloOnOld(file, s){
        $('yolo-tag').textContent = 'LCD 검출 중...';
        try {
          await loadYolo();
          const bbox = await LcdYolo.detect(file);
          if (bbox && bbox.x0 != null){
            await saveTempExtra(s, { removal_lcd_region: { x0:bbox.x0, y0:bbox.y0, x1:bbox.x1, y1:bbox.y1 } });
            // 검출 박스를 철거 사진 미리보기에 그려서 "어디 잡혔는지" 보이게(원본은 그대로 업로드됨)
            try {
              const bmp = await createImageBitmap(file);
              const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
              const cx = cv.getContext('2d'); cx.drawImage(bmp, 0, 0);
              cx.lineWidth = Math.max(6, Math.round(bmp.width * 0.012)); cx.strokeStyle = '#34d399';
              cx.strokeRect(bbox.x0*bmp.width, bbox.y0*bmp.height, (bbox.x1-bbox.x0)*bmp.width, (bbox.y1-bbox.y0)*bmp.height);
              $('img-old').src = cv.toDataURL('image/jpeg', 0.85);
            } catch(e){ console.warn('[YOLO 박스그리기]', e); }
            $('yolo-tag').textContent = 'LCD 위치 검출됨 (초록 박스)';
          } else { $('yolo-tag').textContent = 'LCD 못 찾음 (수동 확인)'; }
        } catch(e){ console.warn('[YOLO]', e); $('yolo-tag').textContent = 'LCD 검출 실패: ' + (e && e.message ? e.message : e); }
      }

      // seq 변경 시 부가 입력 복원/초기화
      function renderSeqExtras(s){
        const tmp = tempIndex[s];
        const entry = seqIndex[s] && seqIndex[s].entry;
        if (_opt.reading){
          let rv = '';
          if (entry && entry.removal_values && entry.removal_values.whme_day != null) rv = entry.removal_values.whme_day;
          else if (entry && entry.removal_value != null) rv = entry.removal_value;
          else if (tmp && tmp.removal_value != null) rv = tmp.removal_value;
          $('reading-val').value = (rv === '' ? '' : String(rv));
          $('yolo-tag').textContent = (tmp && tmp.removal_lcd_region) ? 'LCD 위치 저장됨' : '';
        }
        if (_opt.qr){
          const mid = (entry && entry.new_meter_id) || (tmp && tmp.new_meter_id) || '';
          const mfg = (entry && entry.new_meter_mfg_ym) || (tmp && tmp.new_meter_mfg_ym) || '';
          $('qr-result').textContent = mid ? ('새 계기 '+mid+(mfg?(' / '+mfg):'')) : '';
        }
      }

      // ── 시작 ──
      loadOpts(); applyOpts();
      if (authGetSession()) startApp();
      else showLogin();
    </script>
</body>
