<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1720">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="종로 사진">
    <title>종로 사진 - 보조앱</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="js/config.js?v=snap2"></script>
    <script src="js/auth.js?v=snap2"></script>
    <script src="js/photo-uploader.js?v=snap2"></script>
    <style>
      :root{
        --bg:#0f1720; --card:#172230; --ink:#f2f6fb; --ink-2:#aab8c8;
        --line:#28384a; --mint:#34d399; --mint-d:#10b981; --amber:#f59e0b; --red:#f87171;
        --btn:#1f2d3d; --btn-press:#2a3d52;
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
      html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
        font-size:18px; -webkit-user-select:none; user-select:none;}
      body{padding:14px 14px calc(14px + env(safe-area-inset-bottom));}

      .top{display:flex; align-items:center; justify-content:space-between;
        font-size:16px; color:var(--ink-2); padding:4px 2px 12px;}
      .top .who{font-weight:800; color:var(--ink);}
      .top .refresh{background:var(--btn); border:1px solid var(--line); color:var(--ink);
        font-size:15px; font-weight:700; padding:8px 14px; border-radius:10px; cursor:pointer;}

      .seq-wrap{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:16px 14px 18px; margin-bottom:14px;}
      .seq-label{text-align:center; font-size:17px; font-weight:800; color:var(--ink-2);
        letter-spacing:.04em; margin-bottom:10px;}
      .seq-row{display:flex; align-items:stretch; gap:12px;}
      .seq-btn{flex:1; min-height:88px; font-size:26px; font-weight:900; color:var(--ink);
        background:var(--btn); border:2px solid var(--line); border-radius:16px;
        display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;}
      .seq-btn:active{background:var(--btn-press); transform:scale(.98);}
      .seq-num{flex:0 0 110px; min-height:88px; border-radius:16px;
        background:var(--mint-d); color:#04130d; font-size:52px; font-weight:900;
        display:flex; align-items:center; justify-content:center;}
      .seq-meter{text-align:center; margin-top:12px; font-size:18px; font-weight:700;}
      .seq-meter .no{color:var(--mint);}
      .seq-meter .none{color:var(--amber);}

      .shot{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:14px; margin-bottom:14px;}
      .shot-title{font-size:20px; font-weight:800; margin:0 2px 10px; display:flex; justify-content:space-between; align-items:center;}
      .shot-status{font-size:15px; font-weight:700;}
      .shot-status.saving{color:var(--amber);}
      .shot-status.saved{color:var(--mint);}
      .shot-status.err{color:var(--red);}
      .shot-box{position:relative; width:100%; height:210px; border-radius:14px;
        border:2px dashed var(--line); background:#0d141d;
        display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;}
      .shot-box:active{border-color:var(--mint);}
      .shot-box .hint{font-size:19px; color:var(--ink-2); font-weight:700; text-align:center; line-height:1.5;}
      .shot-box img{width:100%; height:100%; object-fit:cover; display:none;}
      .shot-box.has img{display:block;}
      .shot-box.has .hint{display:none;}
      .shot-box .badge{position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,.62);
        color:#fff; font-size:15px; font-weight:800; padding:8px 14px; border-radius:10px; display:none;}
      .shot-box.has .badge{display:block;}
      .shot-box .spin{position:absolute; inset:0; background:rgba(0,0,0,.45);
        display:none; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#fff;}
      .shot-box.busy .spin{display:flex;}

      .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
        align-items:flex-end; justify-content:center; z-index:50;}
      .sheet-bg.open{display:flex;}
      .sheet{width:100%; max-width:520px; background:var(--card);
        border-radius:22px 22px 0 0; border-top:1px solid var(--line);
        padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
      .sheet h3{margin:4px 0 16px; text-align:center; font-size:20px; font-weight:800;}
      .sheet-btn{width:100%; min-height:74px; font-size:23px; font-weight:800;
        border:none; border-radius:16px; margin-bottom:12px; cursor:pointer;}
      .sheet-cam{background:var(--mint); color:#04130d;}
      .sheet-alb{background:var(--btn); color:var(--ink); border:2px solid var(--line);}
      .sheet-cancel{background:transparent; color:var(--ink-2); min-height:56px; font-size:18px;}
      .sheet-btn:active{transform:scale(.98);}
      .hidden-input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}

      .login-bg{position:fixed; inset:0; background:var(--bg); z-index:100;
        display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
      .login-bg.hide{display:none;}
      .login-bg h2{font-size:24px; font-weight:900; margin:0 0 24px;}
      .login-bg input{width:100%; max-width:360px; min-height:62px; font-size:20px;
        background:var(--card); border:2px solid var(--line); border-radius:14px;
        color:var(--ink); padding:0 16px; margin-bottom:14px;}
      .login-bg button{width:100%; max-width:360px; min-height:66px; font-size:22px; font-weight:800;
        background:var(--mint-d); color:#04130d; border:none; border-radius:14px; cursor:pointer;}
      .login-err{color:var(--red); font-size:16px; font-weight:700; min-height:22px; margin-bottom:10px;}

      .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
        background:#000c; color:#fff; font-size:17px; font-weight:700; padding:12px 20px;
        border-radius:12px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60;}
      .toast.show{opacity:1;}
    </style>
</head>
<body>
    <div class="login-bg" id="login">
        <h2>종로 사진 보조</h2>
        <input type="text" id="lg-id" placeholder="아이디" autocomplete="username" autocapitalize="none">
        <input type="password" id="lg-pw" placeholder="비밀번호" autocomplete="current-password">
        <div class="login-err" id="lg-err"></div>
        <button id="lg-btn">로그인</button>
    </div>

    <div class="top">
        <span class="who" id="who">-</span>
        <span class="refresh" id="refresh">새로고침</span>
    </div>

    <!-- 철거 사진 -->
    <div class="shot">
        <div class="shot-title">철거 사진 <span class="shot-status" id="st-old"></span></div>
        <div class="shot-box" id="box-old" data-slot="old">
            <span class="hint">탭해서 사진 넣기</span>
            <img id="img-old" alt="철거 사진">
            <span class="badge" id="bd-old"></span>
            <div class="spin">저장 중...</div>
        </div>
    </div>

    <!-- 신설 사진 -->
    <div class="shot">
        <div class="shot-title">신설 사진 <span class="shot-status" id="st-new"></span></div>
        <div class="shot-box" id="box-new" data-slot="new">
            <span class="hint">탭해서 사진 넣기</span>
            <img id="img-new" alt="신설 사진">
            <span class="badge" id="bd-new"></span>
            <div class="spin">저장 중...</div>
        </div>
    </div>

    <!-- 작업번호 (저장 위치) -->
    <div class="seq-wrap">
        <div class="seq-label">작업번호</div>
        <div class="seq-row">
            <div class="seq-btn" id="seq-prev">이전</div>
            <div class="seq-num" id="seq-num">1</div>
            <div class="seq-btn" id="seq-next">다음</div>
        </div>
        <div class="seq-meter" id="seq-meter"><span class="none">계기 미할당 (보관 후 자동 연결)</span></div>
    </div>

    <div class="sheet-bg" id="sheet">
        <div class="sheet">
            <h3 id="sheet-title">사진 추가</h3>
            <button class="sheet-btn sheet-cam" id="sheet-cam">촬영</button>
            <button class="sheet-btn sheet-alb" id="sheet-alb">앨범</button>
            <button class="sheet-btn sheet-cancel" id="sheet-cancel">취소</button>
        </div>
    </div>

    <input class="hidden-input" type="file" accept="image/*" capture="environment" id="in-cam">
    <input class="hidden-input" type="file" accept="image/*" id="in-alb">

    <div style="text-align:center; font-size:13px; font-weight:700; color:#5a6b7d; padding:8px 0 4px; letter-spacing:.03em;">종로 보조앱 v20260614.6</div>

    <div class="toast" id="toast"></div>

    <script>
      const $ = id => document.getElementById(id);

      // ── Firebase (ami-jongno 공유) ──
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const statusRef = db.ref('workStatus/jongno');
      const tempRef   = db.ref('tempPhotos/jongno');

      function dayKST(){
        return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul',
          year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
      }
      function msToDayKST(ms){
        return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul',
          year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(ms));
      }

      let session = null;
      let seq = 1;
      let usedSeqs = new Set();   // 오늘 이미 쓰인 작업번호(계기할당 + 임시보관)
      let seqIndex = {};          // 작업번호 → {addr, meterId, entry} (이미 계기 할당된 것)
      let tempIndex = {};         // 작업번호 → temp 보관 {removal_photo, new_meter_photo}

      // ── 자체 로그인 ──
      function showLogin(){ $('login').classList.remove('hide'); }
      function hideLogin(){ $('login').classList.add('hide'); }
      function doLogin(){
        const r = authLogin($('lg-id').value.trim(), $('lg-pw').value);
        if (r.ok){ startApp(); }
        else { $('lg-err').textContent = r.error || '로그인 실패'; $('lg-pw').value=''; $('lg-pw').focus(); }
      }
      $('lg-btn').onclick = doLogin;
      $('lg-pw').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

      async function startApp(){
        session = authGetSession();
        $('who').textContent = session ? (session.name || session.id) : '-';
        hideLogin();
        await loadToday();
        seq = nextEmptySeq();
        renderSeq();
      }

      // ── 오늘 데이터 로드: 작업번호별 계기/보관 인덱싱 + 빈번호 계산 ──
      async function loadToday(){
        const today = dayKST();
        usedSeqs = new Set(); seqIndex = {}; tempIndex = {};
        try {
          const snap = await statusRef.once('value');
          const ws = snap.val() || {};
          for (const addr in ws){
            const rl = ws[addr] && ws[addr].replacement_list;
            if (!rl) continue;
            for (const mid in rl){
              const r = rl[mid];
              if (!r || typeof r.replaced_at !== 'number') continue;
              if (msToDayKST(r.replaced_at) !== today) continue;       // 오늘 것만
              if (typeof r.daily_seq === 'number'){
                usedSeqs.add(r.daily_seq);
                seqIndex[r.daily_seq] = { addr, meterId: r.old_meter_id || mid, entry: r };
              }
            }
          }
          // 임시보관함(사진만, 계기 미할당)도 번호 점유
          const tsnap = await tempRef.child(today).once('value');
          const tv = tsnap.val() || {};
          for (const s in tv){ usedSeqs.add(Number(s)); tempIndex[Number(s)] = tv[s]; }
        } catch(e){ console.error('[loadToday]', e); toast('데이터 로드 실패 — 새로고침'); }
      }

      function nextEmptySeq(){
        let max = 0; usedSeqs.forEach(n => { if (n > max) max = n; });
        for (let i=1; i<=max; i++){ if (!usedSeqs.has(i)) return i; }
        return max + 1;
      }

      // ── 작업번호 표시 + 그 번호의 계기/사진 반영 ──
      function renderSeq(){
        $('seq-num').textContent = seq;
        const hit = seqIndex[seq];
        const tmp = tempIndex[seq];
        const m = $('seq-meter');
        if (hit){
          m.innerHTML = '<span class="no">계기 ' + hit.meterId + ' (할당됨)</span>';
        } else if (tmp){
          m.innerHTML = '<span class="none">보관 중 (계기 미할당)</span>';
        } else {
          m.innerHTML = '<span class="none">계기 미할당 (보관 후 자동 연결)</span>';
        }
        // 이미 올라간 사진 미리보기 (있으면)
        applyExistingPhoto('old', (hit && (hit.entry.old_meter_photo || photoFromRemoval(hit.entry))) || (tmp && tmp.removal_photo));
        applyExistingPhoto('new', (hit && hit.entry.new_meter_photo) || (tmp && tmp.new_meter_photo));
      }
      function photoFromRemoval(entry){
        const rp = entry.removal_photos;
        if (rp && typeof rp === 'object'){ const k = Object.keys(rp)[0]; if (k) return rp[k]; }
        return null;
      }
      function applyExistingPhoto(slot, url){
        const box = $('box-'+slot), img = $('img-'+slot), st = $('st-'+slot);
        if (url){
          img.src = url; box.classList.add('has');
          st.textContent = '있음'; st.className = 'shot-status saved';
          $('bd-'+slot).textContent = seq + '번';
        } else {
          img.removeAttribute('src'); box.classList.remove('has');
          st.textContent = ''; st.className = 'shot-status';
        }
      }

      $('seq-prev').onclick = () => { if (seq > 1) seq--; renderSeq(); };
      $('seq-next').onclick = () => { seq++; renderSeq(); };
      $('refresh').onclick = async () => { await loadToday(); renderSeq(); toast('새로고침 완료'); };

      // ── 팝업 ──
      let sheetSlot = null;
      function openSheet(slot){
        sheetSlot = slot;
        $('sheet-title').textContent = (slot==='old' ? '철거' : '신설') + ' 사진';
        $('sheet').classList.add('open');
      }
      function closeSheet(){ $('sheet').classList.remove('open'); }
      $('box-old').onclick = () => openSheet('old');
      $('box-new').onclick = () => openSheet('new');
      $('sheet-cancel').onclick = closeSheet;
      $('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };
      $('sheet-cam').onclick = () => { closeSheet(); $('in-cam').click(); };
      $('sheet-alb').onclick = () => { closeSheet(); $('in-alb').click(); };

      function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
        clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 1800); }

      // ── 사진 선택 → 미리보기 + 자동 저장 ──
      async function onPick(slot, file){
        if (!file) return;
        const box = $('box-'+slot), img = $('img-'+slot), st = $('st-'+slot);
        const localSeq = seq;
        img.src = URL.createObjectURL(file);
        box.classList.add('has','busy');
        st.textContent = '저장 중'; st.className = 'shot-status saving';
        try {
          await autoSave(slot, file, localSeq);
          st.textContent = '저장됨'; st.className = 'shot-status saved';
          $('bd-'+slot).textContent = localSeq + '번';
          await loadToday();   // 방금 저장분 반영(번호 점유/표시)
        } catch (e) {
          console.error('[autoSave]', e);
          st.textContent = '저장 실패'; st.className = 'shot-status err';
          alert('저장 실패 원인:\n' + ((e && e.code) ? e.code + '\n' : '') + ((e && e.message) ? e.message : String(e)));
        } finally {
          box.classList.remove('busy');
        }
      }
      $('in-cam').onchange = e => { const f=e.target.files[0]; e.target.value=''; if(sheetSlot) onPick(sheetSlot, f); };
      $('in-alb').onchange = e => { const f=e.target.files[0]; e.target.value=''; if(sheetSlot) onPick(sheetSlot, f); };

      // ── Storage 업로드: Capacitor의 XHR shim이 Firebase SDK put()을 깨뜨림(storage/unknown 400).
      //   압축은 SDK(canvas, XHR 무관)로, 업로드는 raw REST로 우회(CDP에서 200 검증됨).
      async function restUpload(blob, path){
        const bucket = firebaseConfig.storageBucket;
        const up = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o?uploadType=media&name=${encodeURIComponent(path)}`;
        // ★Capacitor native-bridge convertBody는 Blob/ArrayBuffer를 어느 분기에도 못 잡아
        //   { data: body, type:'json' }로 떨어뜨림 → 네이티브가 JSON.stringify(Blob)='{}' 전송 →
        //   서버엔 2바이트 '{}'가 image/jpeg로 저장돼 종로 모달서 깨진 사진('?')으로 뜸.
        //   convertBody가 바이너리를 무손실(readFileAsBase64) 처리하는 유일한 타입 = File. 그래서 File로 감쌈.
        const fileBody = (blob instanceof File) ? blob : new File([blob], 'photo.jpg', { type: 'image/jpeg' });
        const res = await fetch(up, { method:'POST', headers:{'Content-Type':'image/jpeg'}, body: fileBody });
        if (!res.ok) throw new Error('storage ' + res.status);
        const d = await res.json();
        // 업로드 검증(fail-loud): 저장 크기가 보낸 크기와 다르면(예: '{}' 2바이트) 실패로 처리.
        //   조용히 깨진 URL을 저장해 며칠 뒤 '?'로 발견되는 일 방지.
        if (d.size != null && fileBody.size && Math.abs(Number(d.size) - fileBody.size) > 16) {
          throw new Error('업로드 손상: 보낸 ' + fileBody.size + 'B → 저장 ' + d.size + 'B');
        }
        const tok = d.downloadTokens ? String(d.downloadTokens).split(',')[0] : '';
        return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(path)}?alt=media&token=${tok}`;
      }

      // ── 자동 저장: 계기 할당됐으면 그 계기에 직접, 아니면 임시보관함 ──
      async function autoSave(slot, file, s){
        const day = dayKST();
        const hit = seqIndex[s];
        const path = hit
          ? `replacements/${hit.addr}/${hit.meterId}_${Date.now()}/${slot}.jpg`
          : `replacements/_temp/${day}/${s}/${slot}.jpg`;
        const blob = await PhotoUploader.compress(file, { square:false });
        const url = await restUpload(blob, path);
        if (hit){
          // 시나리오 A: 이미 할당된 계기에 직접. 사진은 시공자(보조앱) 담당이라 덮어쓰기 허용.
          const node = statusRef.child(hit.addr).child('replacement_list').child(hit.meterId);
          if (slot === 'old'){
            // ★종로 모달은 removal_photos[칸] 우선 표시 → 대표를 whme_day 칸에 (old_meter_photo는 호환용)
            await node.child('removal_photos').child('whme_day').set(url);
            await node.child('old_meter_photo').set(url);
          } else {
            await node.child('new_meter_photo').set(url);
          }
        } else {
          // 시나리오 B: 임시보관함. 나중에 메인앱이 같은 번호에 계기 할당 시 결합
          const field = (slot==='old') ? 'removal_photo' : 'new_meter_photo';
          await tempRef.child(day).child(String(s)).update({
            [field]: url,
            daily_seq: s,
            worker: session ? session.id : '',
            worker_name: session ? (session.name||'') : '',
            updated_at: firebase.database.ServerValue.TIMESTAMP
          });
        }
      }

      // ── 시작 ──
      if (authGetSession()) startApp();
      else showLogin();
    </script>
</body>
</html>
