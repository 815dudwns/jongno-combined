<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="종로 사진">
    <title>종로 사진 - 보조앱</title>
    <!-- 즉시 인증 체크: 로그인 안돼있으면 로그인 화면으로 (같은 origin이라 jongno_auth 공유) -->
    <script src="js/auth.js"></script>
    <script>
      if (!authGetSession()) { window.location.replace('login.html'); }
    </script>
    <style>
      :root{
        --bg:#0f1720; --card:#172230; --ink:#f2f6fb; --ink-2:#aab8c8;
        --line:#28384a; --mint:#34d399; --mint-d:#10b981; --amber:#f59e0b;
        --btn:#1f2d3d; --btn-press:#2a3d52;
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
      html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
        font-size:18px; -webkit-user-select:none; user-select:none;}
      body{padding:14px 14px calc(14px + env(safe-area-inset-bottom));}

      /* 헤더 */
      .top{display:flex; align-items:center; justify-content:space-between;
        font-size:16px; color:var(--ink-2); padding:4px 2px 12px;}
      .top .who{font-weight:800; color:var(--ink);}

      /* 시퀀스 */
      .seq-wrap{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:16px 14px 18px; margin-bottom:14px;}
      .seq-label{text-align:center; font-size:18px; font-weight:800; color:var(--ink-2);
        letter-spacing:.04em; margin-bottom:10px;}
      .seq-row{display:flex; align-items:stretch; gap:12px;}
      .seq-btn{flex:1; min-height:84px; font-size:26px; font-weight:900; color:var(--ink);
        background:var(--btn); border:2px solid var(--line); border-radius:16px;
        display:flex; align-items:center; justify-content:center; cursor:pointer;}
      .seq-btn:active{background:var(--btn-press); transform:scale(.98);}
      .seq-num{flex:0 0 96px; min-height:84px; border-radius:16px;
        background:var(--mint-d); color:#04130d; font-size:46px; font-weight:900;
        display:flex; align-items:center; justify-content:center;}
      .seq-meter{text-align:center; margin-top:12px; font-size:19px; font-weight:700;}
      .seq-meter .no{color:var(--mint); letter-spacing:.02em;}
      .seq-meter .none{color:var(--amber);}

      /* 사진 박스 */
      .shot{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:14px; margin-bottom:14px;}
      .shot-title{font-size:20px; font-weight:800; margin:0 2px 10px;}
      .shot-box{position:relative; width:100%; height:210px; border-radius:14px;
        border:2px dashed var(--line); background:#0d141d;
        display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;}
      .shot-box:active{border-color:var(--mint);}
      .shot-box .hint{font-size:19px; color:var(--ink-2); font-weight:700; text-align:center; line-height:1.5;}
      .shot-box img{width:100%; height:100%; object-fit:cover; display:none;}
      .shot-box.has img{display:block;}
      .shot-box.has .hint{display:none;}
      .shot-box .redo{position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,.6);
        color:#fff; font-size:15px; font-weight:700; padding:8px 14px; border-radius:10px; display:none;}
      .shot-box.has .redo{display:block;}

      /* 팝업 (촬영/앨범 선택) */
      .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
        align-items:flex-end; justify-content:center; z-index:50;}
      .sheet-bg.open{display:flex;}
      .sheet{width:100%; max-width:520px; background:var(--card);
        border-radius:22px 22px 0 0; border-top:1px solid var(--line);
        padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
      .sheet h3{margin:4px 0 16px; text-align:center; font-size:20px; font-weight:800;}
      .sheet-btn{width:100%; min-height:72px; font-size:23px; font-weight:800;
        border:none; border-radius:16px; margin-bottom:12px; cursor:pointer;}
      .sheet-cam{background:var(--mint); color:#04130d;}
      .sheet-alb{background:var(--btn); color:var(--ink); border:2px solid var(--line);}
      .sheet-cancel{background:transparent; color:var(--ink-2); min-height:56px; font-size:18px;}
      .sheet-btn:active{transform:scale(.98);}

      .hidden-input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}

      /* 저장 바 */
      .savebar{position:sticky; bottom:0; padding-top:6px;}
      .save-btn{width:100%; min-height:78px; font-size:24px; font-weight:900;
        background:var(--mint-d); color:#04130d; border:none; border-radius:18px; cursor:pointer;}
      .save-btn:active{transform:scale(.99);}
      .save-btn:disabled{background:#2a3a4a; color:#6b7c8e;}
    </style>
</head>
<body>
    <div class="top">
        <span>종로 사진 보조</span>
        <span class="who" id="who">-</span>
    </div>

    <!-- 데일리 시퀀스 -->
    <div class="seq-wrap">
        <div class="seq-label">데일리 시퀀스</div>
        <div class="seq-row">
            <div class="seq-btn" id="seq-prev">이전</div>
            <div class="seq-num" id="seq-num">1</div>
            <div class="seq-btn" id="seq-next">다음</div>
        </div>
        <div class="seq-meter" id="seq-meter"><span class="none">계기 미할당</span></div>
    </div>

    <!-- 철거 사진 -->
    <div class="shot">
        <div class="shot-title">철거 사진</div>
        <div class="shot-box" id="box-old" data-slot="old">
            <span class="hint">탭해서 사진 넣기</span>
            <img id="img-old" alt="철거 사진">
            <span class="redo">다시</span>
        </div>
    </div>

    <!-- 신설 사진 -->
    <div class="shot">
        <div class="shot-title">신설 사진</div>
        <div class="shot-box" id="box-new" data-slot="new">
            <span class="hint">탭해서 사진 넣기</span>
            <img id="img-new" alt="신설 사진">
            <span class="redo">다시</span>
        </div>
    </div>

    <div class="savebar">
        <button class="save-btn" id="save-btn">저장</button>
    </div>

    <!-- 사진 선택 팝업 -->
    <div class="sheet-bg" id="sheet">
        <div class="sheet">
            <h3 id="sheet-title">사진 추가</h3>
            <button class="sheet-btn sheet-cam" id="sheet-cam">촬영</button>
            <button class="sheet-btn sheet-alb" id="sheet-alb">앨범</button>
            <button class="sheet-btn sheet-cancel" id="sheet-cancel">취소</button>
        </div>
    </div>

    <!-- 숨은 파일 입력 (촬영=capture / 앨범=일반) -->
    <input class="hidden-input" type="file" accept="image/*" capture="environment" id="in-cam">
    <input class="hidden-input" type="file" accept="image/*" id="in-alb">

    <script>
      // ── 골격 단계: 화면 동작만 (Firebase 연동은 다음 단계) ──
      const session = authGetSession();
      document.getElementById('who').textContent = session ? (session.name || session.id) : '-';

      // 상태 (골격: 로컬만)
      let seq = 1;
      const photos = { old: null, new: null };   // { blob, url }
      let sheetSlot = null;                        // 현재 팝업 대상 슬롯

      const $ = id => document.getElementById(id);

      // ── 시퀀스 이전/다음 (골격: 단순 증감, 연동 단계에서 빈번호/역검색 연결) ──
      function renderSeq(){ $('seq-num').textContent = seq; }
      $('seq-prev').onclick = () => { if (seq > 1) seq--; renderSeq(); };
      $('seq-next').onclick = () => { seq++; renderSeq(); };
      renderSeq();

      // ── 사진 박스 탭 → 팝업 ──
      function openSheet(slot){
        sheetSlot = slot;
        $('sheet-title').textContent = (slot === 'old' ? '철거' : '신설') + ' 사진';
        $('sheet').classList.add('open');
      }
      function closeSheet(){ $('sheet').classList.remove('open'); sheetSlot = null; }
      $('box-old').onclick = () => openSheet('old');
      $('box-new').onclick = () => openSheet('new');
      $('sheet-cancel').onclick = closeSheet;
      $('sheet').onclick = (e) => { if (e.target === $('sheet')) closeSheet(); };

      // 촬영/앨범 버튼 → 해당 파일입력 트리거
      $('sheet-cam').onclick = () => { $('in-cam').click(); };
      $('sheet-alb').onclick = () => { $('in-alb').click(); };

      // 파일 선택됨 → 미리보기 (업로드는 연동 단계)
      function onPick(file){
        if (!file || !sheetSlot) { closeSheet(); return; }
        const slot = sheetSlot;
        photos[slot] = { blob: file, url: null };
        const url = URL.createObjectURL(file);
        const img = $('img-' + slot);
        img.src = url;
        $('box-' + slot).classList.add('has');
        closeSheet();
        // TODO(연동): PhotoUploader 압축+업로드 → temp 저장 / 계기 결합 / YOLO
      }
      $('in-cam').onchange = (e) => { onPick(e.target.files[0]); e.target.value = ''; };
      $('in-alb').onchange = (e) => { onPick(e.target.files[0]); e.target.value = ''; };

      // 저장 (골격: 자리만)
      $('save-btn').onclick = () => {
        // TODO(연동): temp 저장 또는 계기 결합 실행
        alert('골격 단계입니다. 다음 단계에서 저장·연동을 붙입니다.\n시퀀스 ' + seq + ' / 철거 ' + (photos.old?'O':'X') + ' / 신설 ' + (photos.new?'O':'X'));
      };
    </script>
</body>
</html>
