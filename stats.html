<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>작업 통계 - Meter Care Solution</title>
  <link rel="stylesheet" href="css/clay.css?v=20260608glow">
  <!-- 즉시 인증 체크 + 자동 캐시 마이그레이션 -->
  <script>
    (function () {
      const APP_VERSION = '20260606theme2';
      if (localStorage.getItem('app_version') !== APP_VERSION) {
        const keep = {};
        ['jongno_auth', 'jongno_event_queue', 'jongno_theme', 'jongno_accent', 'jongno_selected_groups', 'jongno_selected_checkdays', 'jongno_marker_mode', 'jongno_map_view', 'jongno_admin_view_role', 'jongno_comm_missing_only', 'jongno_stats_date', 'jongno_stats_tab'].forEach(k => {
          const v = localStorage.getItem(k);
          if (v !== null) keep[k] = v;
        });
        localStorage.clear();
        Object.entries(keep).forEach(([k, v]) => localStorage.setItem(k, v));
        localStorage.setItem('app_version', APP_VERSION);
        const reloadKey = 'jongno_reloaded_for_' + APP_VERSION;
        if (!sessionStorage.getItem(reloadKey)) {
          sessionStorage.setItem(reloadKey, '1');
          window.location.reload();
          return;
        }
      }
      const raw = localStorage.getItem('jongno_auth');
      if (!raw) { window.location.replace('login.html'); return; }
      try {
        const s = JSON.parse(raw);
        if (s.role !== 'admin' && s.role !== 'meter') { window.location.replace('map.html'); }
      } catch { window.location.replace('login.html'); }
    })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js?v=20260607menu"></script>
  <script src="js/config.js?v=20260606naver"></script>
  <script src="js/utils.js?v=20260528a"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="css/replacement-modal.css?v=20260608d2">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font); background: var(--bg); min-height: 100vh; color: var(--ink); }

    .header { background: var(--surface); color: var(--ink); padding: 13px 16px; position: sticky; top: 0; z-index: 200; display: flex; align-items: center; gap: 10px; box-shadow: var(--clay-sm); }
    .header a { color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 700; }
    .header h1 { font-size: 16px; font-weight: 800; flex: 1; letter-spacing: -0.01em; }
    [data-theme-toggle] { background: var(--bg-deep) !important; color: var(--ink-2) !important; box-shadow: var(--clay-inset-sm); }

    .container { max-width: 1100px; margin: 0 auto; padding: 12px; }

    .date-bar { background: var(--surface); border-radius: 16px; padding: 10px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; box-shadow: var(--clay-sm); }
    .date-bar input { flex: 1; padding: 11px 13px; border: none; border-radius: var(--radius-pill); font-size: 15px; min-width: 0; font-family: var(--font); color: var(--ink); background: var(--bg-deep); box-shadow: var(--clay-inset-sm); outline: none; }
    .date-bar button { padding: 11px 15px; background: linear-gradient(145deg,var(--mint-l),var(--mint)); color: var(--mint-deep); border: none; border-radius: var(--radius-pill); font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: var(--clay-sm); transition: box-shadow .14s; }
    .date-bar button:active { box-shadow: var(--clay-inset-sm); }
    .date-bar button.sec { background: var(--surface); color: var(--ink-2); }

    .summary { background: var(--surface); border-radius: 18px; padding: 13px; margin-bottom: 12px; display: flex; gap: 10px; flex-wrap: wrap; box-shadow: var(--clay-sm); }
    .summary-item { flex: 1; min-width: 100px; text-align: center; padding: 10px 6px; border-radius: 14px; background: var(--mint-soft); box-shadow: var(--clay-inset-sm); }
    .summary-item .label { font-size: 11px; font-weight: 700; color: var(--mint-strong); }
    .summary-item .value { font-size: 23px; font-weight: 800; color: var(--mint-strong); }

    .tabs { display: flex; gap: 6px; background: var(--bg-deep); padding: 4px; border-radius: var(--radius-pill); margin-bottom: 12px; box-shadow: var(--clay-inset-sm); }
    .tab-btn { flex: 1; padding: 11px; background: transparent; color: var(--ink-2); border: none; border-radius: var(--radius-pill); font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.15s; font-family: var(--font); }
    .tab-btn.active { background: var(--surface); color: var(--mint-strong); box-shadow: var(--clay-sm); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    #stats-map { width: 100%; height: 70vh; border-radius: 18px; background: var(--bg-deep); box-shadow: var(--clay-inset-sm); }

    .list-item { background: var(--surface); border-radius: 18px; padding: 13px; margin-bottom: 10px; box-shadow: var(--clay-sm); display: flex; gap: 12px; }
    .seq-badge { width: 42px; height: 42px; flex-shrink: 0; background: linear-gradient(145deg,#9ee0bd,#5fbb8c); color: #1c4733; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; box-shadow: var(--clay-mint); }
    .li-body { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; color: var(--ink); }
    .li-body .addr { font-weight: 800; color: var(--ink); margin-bottom: 4px; }
    .li-body .arrow { color: var(--violet); font-weight: 800; }
    .li-body .meta { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
    .li-photos { display: flex; gap: 5px; flex-shrink: 0; }
    .li-photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 11px; border: none; box-shadow: var(--clay-sm); cursor: pointer; }

    .empty { text-align: center; color: var(--ink-3); padding: 40px 8px; font-size: 14px; }
    .err { background: var(--rose-soft); color: #b91c1c; border: none; border-radius: 14px; padding: 12px; margin-bottom: 12px; font-size: 13px; box-shadow: var(--clay-sm); }

    /* 사진 라이트박스 */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .lightbox-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }

    /* 네이버 지도 커스텀 마커 (번호 표시) */
    .stat-marker { background: linear-gradient(145deg,#5fbb8c,#3f9e6f); color: white; border: 2px solid var(--surface); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .stat-marker.multi { background: linear-gradient(145deg,#b9a6e0,#9579c9); width: 36px; height: 36px; font-size: 11px; padding: 2px; line-height: 1; text-align: center; }
    /* 분석 탭 */
    .ana-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .ana-mode { padding: 9px 16px; border: none; background: var(--surface); border-radius: var(--radius-pill); font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink-2); box-shadow: var(--clay-sm); font-family: var(--font); }
    .ana-mode.active { background: linear-gradient(145deg,var(--mint-l),var(--mint)); color: var(--mint-deep); box-shadow: var(--clay-mint); }
    #ana-prev, #ana-next { color: var(--mint-strong); font-weight: 900; }
    .ana-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 14px; }
    .ana-table th, .ana-table td { border: 1px solid var(--bg-deep); padding: 8px 10px; text-align: center; color: var(--ink); }
    .ana-table th { background: var(--bg-deep); font-weight: 800; color: var(--ink-2); }
    .ana-table td.tname { text-align: left; font-weight: 700; }
    .ana-table tr.subtotal { background: var(--surface-2); font-weight: 800; }
    .ana-table .num { font-variant-numeric: tabular-nums; }
    .ana-h { font-size: 15px; font-weight: 800; margin: 6px 0 8px; color: var(--ink); }
    /* 임시저장 뱃지 */
    .draft-badge { display: inline-block; background: var(--amber-soft); color: #92400e; border: none; border-radius: 7px; padding: 2px 7px; font-size: 11px; font-weight: 800; margin-left: 6px; box-shadow: var(--clay-sm); }

    /* 다크 모드 보정 */
    [data-theme="dark"] body { background: var(--bg); color: var(--ink); }
    [data-theme="dark"] .date-bar,
    [data-theme="dark"] .summary,
    [data-theme="dark"] .list-item,
    [data-theme="dark"] .tabs,
    [data-theme="dark"] .ana-mode,
    [data-theme="dark"] .section { background: var(--surface); color: var(--ink); box-shadow: var(--clay-sm); border-color: var(--surface-2); }
    [data-theme="dark"] .date-bar input { background: var(--bg-deep); color: var(--ink); border-color: var(--surface-2); }
    [data-theme="dark"] .date-bar button.sec,
    [data-theme="dark"] .tab-btn.active { background: var(--bg-deep); color: var(--mint-strong); }
    [data-theme="dark"] .tab-btn { color: var(--ink-2); }
    [data-theme="dark"] .summary-item { background: var(--mint-soft); }
    [data-theme="dark"] .summary-item .label,
    [data-theme="dark"] .summary-item .value { color: var(--mint-strong); }
    [data-theme="dark"] .li-body .addr,
    [data-theme="dark"] .ana-h { color: var(--ink); }
    [data-theme="dark"] .li-body .meta,
    [data-theme="dark"] .empty { color: var(--ink-2); }
    [data-theme="dark"] .ana-table th { background: var(--bg-deep); color: var(--ink-2); border-color: var(--surface-2); }
    [data-theme="dark"] .ana-table td { border-color: var(--surface-2); }
    [data-theme="dark"] .ana-table tr.subtotal { background: var(--bg-deep); }
    /* 복사 토스트 — detail.js/map.html과 동일 (common.css .toast 이식) */
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--ink); padding: 11px 20px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; box-shadow: var(--clay-sm); pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 9999; white-space: nowrap; }
    .toast.show { opacity: 1; }
    /* 복사버튼 — 주소 모달(panel.css)과 동일: 배경 없음 (stats는 panel.css 미로드) */
    .copy-btn { background: none; border: none; cursor: pointer; padding: 0 3px; color: var(--ink-3); line-height: 1; vertical-align: middle; display: inline-flex; align-items: center; }
    .copy-btn:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="header">
    <a href="map.html">← 지도</a>
    <h1>작업 통계</h1>
    <button data-theme-toggle onclick="jongnoCycleTheme()" style="padding:6px 10px;border:none;border-radius:999px;background:rgba(255,255,255,0.18);color:inherit;font-size:12px;font-weight:700;cursor:pointer;">시스템</button>

  <!-- 계기 교체 입력 모달 (map.html과 동일) -->
  <div id="rpl-modal" class="rpl-modal">
    <div class="rpl-card">
      <div class="rpl-header">
        <div style="flex:1;min-width:0;">
          <h3>계기 교체 등록</h3>
          <p id="rpl-title-addr" style="font-size:12px;color:#6b7280;margin:2px 0 0;line-height:1.3;word-break:break-all;"></p>

        </div>
        <div class="rpl-field" id="rpl-rv-field-whme-mngt" style="display:none;">

          <div class="rpl-photo rpl-rv-photo" id="rpl-rv-photo-whme-mngt" data-field="whme_mngt">
            <span class="rpl-photo-label">야간 계기판 사진 (탭하여 선택)</span>
            <img class="rpl-photo-preview" alt="야간 계기판">
          </div>
          <input type="file" class="rpl-rv-photo-input" id="rpl-rv-photo-input-whme-mngt" data-field="whme_mngt" accept="image/*" style="display:none;">
        </div>
        <div class="rpl-field" id="rpl-rv-field-dm-mt" style="display:none;">
          <label>최대전력(kW)</label>

            <span class="rpl-photo-label">최대전력 계기판 사진 (탭하여 선택)</span>
            <img class="rpl-photo-preview" alt="최대전력 계기판">
          </div>

      <div class="rpl-field rpl-replace-only">

    </div>
  </div>

  <div id="rpl-toast" class="rpl-toast"></div>

<script>
authRequire();

// 통계 열람 권한 — admin + 계기팀(meter)
(function () {
  const session = authGetSession();
  if (!session || (session.role !== 'admin' && session.role !== 'meter')) {
    alert('통계 열람 권한 필요');
    location.href = 'map.html';
  }
})();

// Firebase init (RplModal이 글로벌 db/statusRef 사용하므로 window에 노출)
const fbApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
window.db = fbApp.database();
const db = window.db;
window.statusRef = db.ref('workStatus/jongno');

// RplModal 의존성 stub (firebase.js 안 로드해도 동작하게)
window.encodeKey = function (str) {
  return String(str)
    .replace(/\./g, '_dot_').replace(/#/g, '_hash_').replace(/\$/g, '_dollar_')
    .replace(/\[/g, '_lb_').replace(/\]/g, '_rb_').replace(/\//g, '_sl_');
};
window.workStatus = {};
window.makeEmptyEntry = function () { return { replacement_list: {}, added_meters: {} }; };
window.statsAfterModalChange = function () { loadData(); };

let map = null;
let markers = [];
let cachedData = null;  // 그날 replacement 목록
let _naverMapsLoading = null;

function getNaverMapsKey() {
  const key = (typeof NAVER_MAPS_NCP_KEY_ID !== 'undefined') ? NAVER_MAPS_NCP_KEY_ID : '';
  return String(key || '').trim();
}

function loadNaverMapsSdk() {
  if (window.naver && window.naver.maps) return Promise.resolve();
  if (_naverMapsLoading) return _naverMapsLoading;
  const key = getNaverMapsKey();
  if (!key || key === 'YOUR_NCP_KEY_ID') {
    return Promise.reject(new Error('네이버 지도 NCP Key ID가 설정되지 않았습니다. js/config.js의 NAVER_MAPS_NCP_KEY_ID를 입력하세요.'));
  }
  _naverMapsLoading = new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-naver-map-sdk]');
    if (existing) {
      existing.addEventListener('load', () => resolve(), { once: true });
      existing.addEventListener('error', () => reject(new Error('네이버 지도 SDK 로드 실패')), { once: true });
      return;
    }
    const script = document.createElement('script');
    script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(key)}`;
    script.async = true;
    script.defer = true;
    script.dataset.naverMapSdk = '1';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('네이버 지도 SDK 로드 실패'));
    document.head.appendChild(script);
  });
  return _naverMapsLoading;
}

function makeLatLng(lat, lng) {
  return new naver.maps.LatLng(Number(lat), Number(lng));
}

// 날짜 → ms 범위 (KST 자정 기준)
function dayRange(yyyymmdd) {
  return kstDayRange(yyyymmdd);
}

function todayStr() {
  return kstYmd(new Date());
}

// 네이버 지도 초기화 (지도 탭 활성 시점에 한 번만)
async function ensureMap() {
  if (map) return;
  const container = document.getElementById('stats-map');
  try {
    await loadNaverMapsSdk();
  } catch (e) {
    console.error('[naverMap] 로드 실패:', e);
    if (container) container.innerHTML = `<div class="err">${e.message}</div>`;
    return;
  }
  map = new naver.maps.Map(container, {
    center: makeLatLng(37.5760, 126.9850),  // 종로구 기본
    zoom: 13,
    minZoom: 7,
    zoomControl: false,
    mapDataControl: false,
    scaleControl: false,
    logoControlOptions: { position: naver.maps.Position.BOTTOM_LEFT }
  });
  drawMarkers();
}

function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
}

function drawMarkers() {
  if (!map || !cachedData) return;
  clearMarkers();

  // 주소별 그룹핑 → 한 주소에 여러 작업이면 번호 묶음
  const byAddr = {};
  cachedData.forEach(item => {
    const key = item.address;
    if (!byAddr[key]) byAddr[key] = [];
    byAddr[key].push(item);
  });

  const bounds = new naver.maps.LatLngBounds();
  let hasBounds = false;
  Object.entries(byAddr).forEach(([addr, items]) => {
    // 좌표는 site-data가 아니라 첫 item의 lat/lng (siteData에서 가져와야 함)
    // 일단 시도: items[0].lat/lng 가정. 없으면 skip.
    const lat = items[0].lat;
    const lng = items[0].lng;
    if (!lat || !lng) return;

    const pos = makeLatLng(lat, lng);
    bounds.extend(pos);
    hasBounds = true;

    const seqs = items.map(i => i.daily_seq).sort((a, b) => a - b);
    const label = seqs.length === 1 ? String(seqs[0]) : seqs.join(',');
    const isMulti = seqs.length > 1;

    const content = `<div class="stat-marker ${isMulti ? 'multi' : ''}">${label}</div>`;
    const overlay = new naver.maps.Marker({
      position: pos,
      map,
      icon: { content, anchor: new naver.maps.Point(isMulti ? 18 : 15, isMulti ? 18 : 15) },
    });
    markers.push(overlay);
  });

  if (hasBounds) {
    map.fitBounds(bounds);
  }
}

// 사진 받기 (Web Share=사진첩 저장 우선, 폴백 다운로드) — detail.js와 동일 로직
async function sharePhotos(oldUrl, newUrl, base) {
  const items = [[oldUrl, '철거전'], [newUrl, '철거후']];
  const files = [];
  for (const [url, tag] of items) {
    if (!url) continue;
    try {
      const r = await fetch(url);
      const b = await r.blob();
      files.push(new File([b], `${base}_${tag}.jpg`, { type: 'image/jpeg' }));
    } catch (e) {}
  }
  if (!files.length) { alert('사진을 불러오지 못했습니다.'); return; }
  // iOS만 공유시트(사진첩 저장). 안드로이드는 공유시트 건너뛰고 바로 다운로드.
  const _isAndroid = /Android/i.test(navigator.userAgent);
  if (!_isAndroid && navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files, title: '교체 사진' }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  for (const f of files) {
    const u = URL.createObjectURL(f);
    const x = document.createElement('a');
    x.href = u; x.download = f.name;
    document.body.appendChild(x); x.click(); x.remove();
    setTimeout(() => URL.revokeObjectURL(u), 2000);
    await new Promise(res => setTimeout(res, 500));
  }
}

let siteDataByMeterId = null;
async function loadSiteData() {
  if (siteDataByMeterId) return siteDataByMeterId;
  const res = await fetch('./data/jongno-site-data.json');
  const arr = await res.json();
  siteDataByMeterId = {};
  arr.forEach(m => {
    if (m.계기번호) siteDataByMeterId[String(m.계기번호)] = m;
  });

async function loadData() {
  const dateVal = document.getElementById('date-input').value;
  if (!dateVal) return;
  try { localStorage.setItem('jongno_stats_date', dateVal); } catch (e) {}
  const { start, end } = dayRange(dateVal);

  const [wsSnap, sdMap] = await Promise.all([
    db.ref('workStatus/jongno').once('value'),
    loadSiteData(),
  ]);
  const ws = wsSnap.val() || {};

  // workStatus 순회하며 그날 replacement_list 추출
  // 좌표·주소 = 기존 계기번호로 site-data 매칭
  const items = [];
  Object.entries(ws).forEach(([addrKey, val]) => {
    const rl = val.replacement_list;
    if (!rl) return;
    Object.values(rl).forEach(r => {
      const ts = r.replaced_at;
      if (typeof ts !== 'number' || ts < start || ts > end) return;
      const decoded = decodeKey(addrKey);
      const matched = sdMap[String(r.old_meter_id)] || {};
      items.push({
        ...r,
        address: decoded,
        lat: matched.lat,
        lng: matched.lng,
        road_addr: matched.도로명주소,
        jibun_addr: matched.주소,
      });
    });
  });

  cachedData = items;

  // RplModal이 쓰는 글로벌 workStatus 채우기 (decoded 주소 = 키)
  window.workStatus = {};
  Object.entries(ws).forEach(([addrKey, val]) => {
    if (!val || typeof val !== 'object') return;
    window.workStatus[decodeKey(addrKey)] = val;
  });

  renderSummary();
  renderList();
  if (map) drawMarkers();
}

// 키 인코딩 helper (firebase.js와 동일)
function decodeKey(str) {
  return str
    .replace(/_dot_/g, '.').replace(/_hash_/g, '#').replace(/_dollar_/g, '$')
    .replace(/_lb_/g, '[').replace(/_rb_/g, ']').replace(/_sl_/g, '/');
}

}

// ───── 분석 탭 ─────
// 분석 타입 = parseType(E/EA/G/Amigo) + phaseOf(단상/삼상) 조합 — 구계기·신계기 공통(구형 17도 분류)
function anaType(m) {
  const t = (typeof parseType === 'function') ? parseType(m) : null;
  const p = (typeof phaseOf === 'function') ? phaseOf(m) : null;
  if (!t || !p) return '기타';
  return `${t}_${p}`;
}
const ANA_DANSANG = ['E_단상', 'EA_단상', 'G_단상', 'Amigo_단상'];
const ANA_SAMSANG = ['G_삼상', 'Amigo_삼상'];
const ANA_LABEL = { 'E_단상': 'E 단상', 'EA_단상': 'EA 단상', 'G_단상': 'G 단상', 'Amigo_단상': 'AMIGO 단상', 'G_삼상': 'G 삼상', 'Amigo_삼상': 'AMIGO 삼상' };
let _anaMode = 'week';
let _anaAnchor = null;       // 기간 기준 Date (그 날이 속한 주/월)
let _allWsCache = null;

async function getAllWs() {
  if (_allWsCache) return _allWsCache;
  const snap = await db.ref('workStatus/jongno').once('value');
  _allWsCache = snap.val() || {};
  return _allWsCache;
}

// 기간(KST) 계산 — week=월~일, month=해당 월
function anaPeriod() {
  const anchor = _anaAnchor || new Date();
  if (_anaMode === 'month') {
    const y = anchor.getFullYear(), m = anchor.getMonth();
    const start = Date.UTC(y, m, 1, -9, 0, 0, 0);          // KST 1일 00:00
    const end = Date.UTC(y, m + 1, 1, -9, 0, 0, 0) - 1;    // KST 말일 23:59:59
    return { start, end, label: `${y}.${m + 1}` };
  }
  // 주간: anchor가 속한 주 월~일 (KST)
  const kd = new Date(anchor.getTime() + 9 * 3600 * 1000); // KST 시각
  const dow = (kd.getUTCDay() + 6) % 7;                     // 월=0
  const ky = kd.getUTCFullYear(), km = kd.getUTCMonth(), kday = kd.getUTCDate();
  const start = Date.UTC(ky, km, kday - dow, -9, 0, 0, 0);
  const end = Date.UTC(ky, km, kday - dow + 7, -9, 0, 0, 0) - 1;
  const s = new Date(start + 9 * 3600 * 1000), e = new Date(end + 9 * 3600 * 1000);
  const fmt = (d) => `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
  return { start, end, label: `${fmt(s)}~${fmt(e)}` };
}

function stepAna(delta) {
  const base = _anaAnchor || new Date();
  const d = new Date(base);
  if (_anaMode === 'month') d.setMonth(d.getMonth() + delta);
  else d.setDate(d.getDate() + delta * 7);
  _anaAnchor = d;
  renderAnalysis();
}

function anaTable(title, cntMap, totalLabel) {
  const row = (t) => `<tr><td class="tname">${ANA_LABEL[t] || t}</td><td class="num">${cntMap[t] || 0}</td></tr>`;
  const sum = (arr) => arr.reduce((a, t) => a + (cntMap[t] || 0), 0);
  const dan = sum(ANA_DANSANG), sam = sum(ANA_SAMSANG), etc = cntMap['기타'] || 0;
  const total = dan + sam + etc;
  return `
    <div class="ana-h">${title} (${totalLabel}: ${total})</div>
    <table class="ana-table">
      <thead><tr><th>타입</th><th>개수</th></tr></thead>
      <tbody>
        ${ANA_DANSANG.map(row).join('')}
        <tr class="subtotal"><td class="tname">단상 소계</td><td class="num">${dan}</td></tr>
        ${ANA_SAMSANG.map(row).join('')}
        <tr class="subtotal"><td class="tname">삼상 소계</td><td class="num">${sam}</td></tr>
        ${etc ? `<tr><td class="tname">기타</td><td class="num">${etc}</td></tr>` : ''}
        <tr class="subtotal"><td class="tname">합계</td><td class="num">${total}</td></tr>
      </tbody>
    </table>`;
}

async function renderAnalysis() {
  const content = document.getElementById('ana-content');
  content.innerHTML = '<div class="empty">집계 중...</div>';
  const [ws, sd] = await Promise.all([getAllWs(), loadSiteData()]);
  const { start, end, label } = anaPeriod();
  document.getElementById('ana-period').textContent = label;

  const replacedOld = new Set();   // 전체 교체된 구계기 (잔여 계산용)
  const repCnt = {};               // 기간 내 교체분 type5 카운트 (신계기 기준)
  Object.values(ws).forEach(v => {
    const rl = v && v.replacement_list; if (!rl) return;
    Object.values(rl).forEach(r => {
      if (r.old_meter_id) replacedOld.add(String(r.old_meter_id).trim());
      const ts = r.replaced_at;
      if (typeof ts === 'number' && ts >= start && ts <= end) {
        const t = anaType(r.new_meter_id);
        repCnt[t] = (repCnt[t] || 0) + 1;
      }
    });
  });
  // 잔여 = site-data 전체 − 교체된 구계기 (현재 시점, 기간 무관)
  const remCnt = {};
  Object.keys(sd).forEach(mid => {
    if (replacedOld.has(String(mid).trim())) return;
    const t = anaType(mid);
    remCnt[t] = (remCnt[t] || 0) + 1;
  });

  content.innerHTML =
    anaTable(`교체 (${label})`, repCnt, '교체수') +
    anaTable('잔여 (현재 전체)', remCnt, '잔여수');
}

      '고객번호': s.고객번호 || item.cust_no || '',
      '상호': s.상호 || '',
      '호수(공동주택)': s.공동주택명 || '',
      '고객명': s.고객명 || '',
      '철거계기번호': item.old_meter_id || '',
      '신설계기번호': item.new_meter_id || '',
      '철거지침_주간': rv.whme_day ?? (item.removal_value ?? ''),
      '철거지침_야간': rv.whme_mngt ?? '',
      '철거지침_최대': rv.dm_mt_day ?? '',
      '철거지침_무효': rv.var_day ?? '',
      '제조년월': item.new_meter_mfg_ym || '',
      '철거전사진': item.old_meter_photo || '',
      '철거후사진': item.new_meter_photo || '',
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '작업');
  const dv = document.getElementById('date-input').value || todayStr();
  XLSX.writeFile(wb, `종로_작업_${dv}.xlsx`);
}
document.getElementById('btn-export').onclick = exportExcel;

// 초기 데이터 로드 후 이전 세션 탭 복원
// (지도/분석 탭은 cachedData가 준비된 뒤 그려야 그전 날짜 필터가 반영됨)
loadData().then(() => {
  let st = null; try { st = localStorage.getItem('jongno_stats_tab'); } catch (e) {}
  if (st && st !== 'list') {
    const tb = document.querySelector(`.tab-btn[data-tab="${st}"]`);
    if (tb) tb.click();
  }
});
</script>
