<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - Meter Care Solution</title>
    <link rel="stylesheet" href="css/clay.css?v=20260607menu">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css?v=20260606clay">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            <!-- 앱 이름 -->
            <div class="login-header">
                <div class="logo-tile">
                    <span class="logo-mark">
                        <svg viewBox="0 0 56 50" aria-label="한옥 지붕">
                            <path class="roof" d="M28 4c-1.2 0-2 .5-3 1.6L7 21c-2.2 1.9-3.4 3-3.4 4 0 .9.8 1.4 2.3 1.4h44.2c1.5 0 2.3-.5 2.3-1.4 0-1-1.2-2.1-3.4-4L31 5.6C30 4.5 29.2 4 28 4Z"/>
                            <rect class="roof-2" x="6" y="27" width="44" height="4" rx="2"/>
                            <rect class="pillar" x="13" y="33" width="5" height="12" rx="1.6"/>
                            <rect class="pillar" x="25.5" y="33" width="5" height="12" rx="1.6"/>
                            <rect class="pillar" x="38" y="33" width="5" height="12" rx="1.6"/>
                            <rect class="base" x="8" y="45" width="40" height="4" rx="2"/>
                        </svg>
                    </span>
                </div>
                <h1 class="login-title">Meter Care Solution</h1>
                <p class="login-version">v2026.06.06</p>
            </div>

            <!-- 로그인 폼 -->
            <form id="login-form" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="input-id">아이디</label>
                    <input
                        type="text"
                        id="input-id"
                        placeholder="아이디 입력"
                        autocomplete="username"
                        autocapitalize="none"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="input-pw">비밀번호</label>
                    <input
                        type="password"
                        id="input-pw"
                        placeholder="비밀번호 입력"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- 에러 메시지 -->
                <p id="error-msg" class="error-msg" aria-live="polite"></p>

                <button type="submit" id="login-btn" class="login-btn">로그인</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/theme.js?v=20260607menu"></script>
    <script>
        // 이미 로그인된 상태면 바로 map.html로 이동
        (function () {
            if (authGetSession()) {
                window.location.href = 'map.html';
            }
        })();

        function handleLogin(e) {
            e.preventDefault();
            const id  = document.getElementById('input-id').value.trim();
            const pw  = document.getElementById('input-pw').value;
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error-msg');

            // 에러 초기화
            err.textContent = '';
            btn.disabled = true;
            btn.textContent = '로그인 중...';

            const result = authLogin(id, pw);

            if (result.ok) {
                window.location.href = 'map.html';
            } else {
                err.textContent = result.error;
                btn.disabled = false;
                btn.textContent = '로그인';
                // 비밀번호 필드 초기화 후 포커스
                document.getElementById('input-pw').value = '';
                document.getElementById('input-pw').focus();
            }
        }
    </script>
</body>
</html>
