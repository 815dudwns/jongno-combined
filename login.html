<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - 종로 합동시공</title>
    <link rel="stylesheet" href="css/clay.css?v=20260606a">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            <!-- 앱 이름 -->
            <div class="login-header">
                <div class="login-icon">📡</div>
                <h1 class="login-title">종로 합동시공 지도</h1>
                <p class="login-subtitle">한전KDN 강북지사</p>
                <p class="login-version" style="font-size:11px;color:#9ca3af;margin-top:4px;letter-spacing:0.5px;">v2026.06.06</p>
            </div>

            <!-- 로그인 폼 -->
            <form id="login-form" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="input-id">아이디</label>
                    <input
                        type="text"
                        id="input-id"
                        placeholder="아이디 입력"
                        autocomplete="username"
                        autocapitalize="none"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="input-pw">비밀번호</label>
                    <input
                        type="password"
                        id="input-pw"
                        placeholder="비밀번호 입력"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- 에러 메시지 -->
                <p id="error-msg" class="error-msg" aria-live="polite"></p>

                <button type="submit" id="login-btn" class="login-btn">로그인</button>
            </form>

            <a href="guide.html" class="guide-link">사용설명서 보기</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // 이미 로그인된 상태면 바로 map.html로 이동
        (function () {
            if (authGetSession()) {
                window.location.href = 'map.html';
            }
        })();

        function handleLogin(e) {
            e.preventDefault();
            const id  = document.getElementById('input-id').value.trim();
            const pw  = document.getElementById('input-pw').value;
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error-msg');

            // 에러 초기화
            err.textContent = '';
            btn.disabled = true;
            btn.textContent = '로그인 중...';

            const result = authLogin(id, pw);

            if (result.ok) {
                window.location.href = 'map.html';
            } else {
                err.textContent = result.error;
                btn.disabled = false;
                btn.textContent = '로그인';
                // 비밀번호 필드 초기화 후 포커스
                document.getElementById('input-pw').value = '';
                document.getElementById('input-pw').focus();
            }
        }
    </script>
</body>
</html>
