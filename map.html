    <!-- 즉시 인증 체크 + 자동 캐시 마이그레이션 -->
    <script>
      // 앱 버전 바뀌면 localStorage 자동 클리어 (auth/eventQueue만 유지)
      // 폰 사용자가 콘솔 없이도 새 버전 받게
      (function () {
        const APP_VERSION = '20260813.3';
        if (localStorage.getItem('app_version') !== APP_VERSION) {
          const keep = {};
          // 지역 데이터·설정 전부 보존(종로/구로 모든 jongno_/guro_ 키 + 지역선택 mcs_region)
          // — 버전업에 작업자 데이터·지역설정 유실 금지
          const KEEP_RE = /^(jongno|guro)_|^mcs_region$/;
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && KEEP_RE.test(k)) keep[k] = localStorage.getItem(k);
          }
          localStorage.clear();
          Object.entries(keep).forEach(([k, v]) => localStorage.setItem(k, v));
          localStorage.setItem('app_version', APP_VERSION);
          // 캐시 강제 갱신 — 새 버전이면 한 번 더 reload (sessionStorage로 1회 보장)
          const reloadKey = 'jongno_reloaded_for_' + APP_VERSION;
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            window.location.reload();
            return;
          }
        }
      })();
      // 딥링크 ?region=jongno|guro → mcs_region 설정 (검증포털 지도버튼 등 지역지정 진입).
      // regions.js·auth체크보다 먼저 — mcs_region은 KEEP_RE 보존이라 wipe·로그인 거쳐도 살아남음.
      try {
        const _rgParam = new URLSearchParams(location.search).get('region');
        if (_rgParam === 'jongno' || _rgParam === 'guro') localStorage.setItem('mcs_region', _rgParam);
      } catch (e) {}
      // 인증 체크 (즉시)
      if (!localStorage.getItem('jongno_auth')) {
        document.documentElement.style.visibility = 'hidden';
        window.location.replace('login.html');
      }
      // bfcache 복귀(뒤로가기) 시 재검사 — 로그아웃 후 뒤로가기로 맵 노출 차단
      window.addEventListener('pageshow', function (e) {
        if (e.persisted && !localStorage.getItem('jongno_auth')) {
          document.documentElement.style.visibility = 'hidden';
          window.location.replace('login.html');
        }
      });
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <!-- QR/바코드 라이브 스캔 -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- 검색 모달 -->

            </div>
            <div class="search-hint" id="search-hint">4자 이상 입력하세요</div>
            <div class="search-results" id="search-results"></div>
        </div>
    </div>

                <button class="search-reset-btn" id="meter-search-reset" onclick="document.getElementById('meter-search').value='';renderMetersList();">✕</button>

    <!-- 계기 교체 입력 모달 -->

      <div class="rpl-card">
        <div class="rpl-header">

            <h3>계기 교체 등록</h3>
            <p id="rpl-title-addr" style="font-size:12px;color:#6b7280;margin:2px 0 0;line-height:1.3;word-break:break-all;"></p>
          </div>
          <span class="rpl-seq" id="rpl-seq">오늘 <button type="button" id="rpl-seq-dec" class="rpl-seq-btn">‹</button> <span class="num" id="rpl-seq-num">?</span> <button type="button" id="rpl-seq-inc" class="rpl-seq-btn">›</button> 번째</span>
          <button class="rpl-close" id="rpl-close">×</button>
        </div>

        <div class="rpl-current-meter rpl-replace-only" id="rpl-current-meter" style="display:none;">
          <span class="rpl-current-label">현재 계기번호</span>
          <strong id="rpl-current-meter-id">-</strong>
        </div>

        <div class="rpl-field rpl-add-only" style="display:none;">
          <label>계기 11자리</label>
          <input type="text" id="rpl-old-meter-id" inputmode="numeric" maxlength="11" placeholder="">
          <div class="rpl-alpha-row" style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
            <button type="button" class="rpl-alpha-btn" data-ch="A">A</button>
            <button type="button" class="rpl-alpha-btn" data-ch="B">B</button>
            <button type="button" class="rpl-alpha-btn" data-ch="G">G</button>
            <button type="button" class="rpl-alpha-btn" data-ch="L">L</button>
            <button type="button" class="rpl-alpha-btn" data-ch="BS" style="margin-left:auto;background:var(--rose-soft,#f3cdcd);color:#b13c3c;">⌫</button>
          </div>
        </div>

        <div class="rpl-replace-only" id="rpl-removal-fields">
          <div class="rpl-field" id="rpl-rv-field-whme-day" style="display:none;">

    <script src="js/auth.js?v=20260802a"></script>

    <script>
        // 검증 포털 주소 — github 배포본(jongno-combined). 백엔드는 로컬(127.0.0.1:8765) 의존, 추후 독립 예정.
        const VALIDATE_PORTAL_URL = 'https://815dudwns.github.io/jongno-combined/admin-validate.html';

        // 무적 admin/admin2 URL 자동로그인 — 다른 앱(검증 포털 등)에서 ?auth= 딥링크로 진입 시
        // 세션 없을 때만 심음(이미 로그인됐으면 무시). 비번은 auth.js ACCOUNTS와 동일.
        (function () {
            const a = new URLSearchParams(location.search).get('auth');
            const PW = { admin: '1201', admin2: '1234' };
            if (PW[a] && !authGetSession()) authLogin(a, PW[a]);
        })();

        // 로그인 체크 — 미인증이면 login.html로 이동
        authRequire();

        // 사용자 이름 표시 + 어드민 버튼
        (function () {
            const session = authGetSession();
            if (session) {
                document.getElementById('user-name-display').textContent = session.name;
                if (session.role === 'admin') {
                    document.getElementById('am-admin').style.display = '';
                    const up = document.getElementById('admin-upload-btn');
                    if (up) up.style.display = '';
                    const vp = document.getElementById('validate-portal-btn');
                    if (vp) vp.href = VALIDATE_PORTAL_URL;
                }
                // 통계 — admin + 계기팀(meter)에게 노출
                if (session.role === 'admin' || session.role === 'meter') {
                    document.getElementById('stats-btn').style.display = '';
                }
            }
        })();
    </script>

    <script>
      // 앱 메뉴 토글 + 테마색 스와치
      (function () {
        const trigger = document.getElementById('menu-trigger');
        const menu = document.getElementById('app-menu');
        const overlay = document.getElementById('app-menu-overlay');
        if (!trigger || !menu || !overlay) return;
        const openMenu = () => { menu.classList.add('open'); overlay.classList.add('open'); };
        const closeMenu = () => { menu.classList.remove('open'); overlay.classList.remove('open'); };
        trigger.onclick = openMenu;
        overlay.onclick = closeMenu;
        const closeBtn = document.getElementById('am-close');
        if (closeBtn) closeBtn.onclick = closeMenu;

        // 통계 = iframe 모달 (페이지 이동 없이 — 지도/Firebase 리스너 유지, 닫으면 즉시 원상태)
        const statsBtn = document.getElementById('stats-btn');
        const statsOverlay = document.getElementById('stats-overlay');
        const statsFrame = document.getElementById('stats-frame');
        const statsClose = document.getElementById('stats-close');
        const openStats = () => {
          if (!statsOverlay || !statsFrame) return;
          // ?v=캐시버스트 + 최초 로드 시에만 src 세팅(닫을 때 about:blank로 비워 Firebase 소켓 정리)
          statsFrame.src = 'stats.html?v=20260630.2';
          statsOverlay.style.display = 'flex';
        };
        const closeStats = () => {
          if (!statsOverlay || !statsFrame) return;
          statsOverlay.style.display = 'none';
          statsFrame.src = 'about:blank';   // iframe 내 Firebase 연결 해제 + 메모리 회수
        };
        if (statsBtn) statsBtn.onclick = (e) => { e.preventDefault(); closeMenu(); openStats(); };
        if (statsClose) statsClose.onclick = closeStats;
        // iframe 내부(stats.html '← 지도'/권한실패)에서 닫기 요청
        window.addEventListener('message', (e) => { if (e.data === 'jongno-close-stats') closeStats(); });
        // 트리 펼침/접힘
        menu.querySelectorAll('.am-tree > .am-head').forEach(h => {
          h.onclick = () => h.parentElement.classList.toggle('open');
        });
        // 테마색 스와치 렌더
        const sw = document.getElementById('am-swatches');
        if (sw && window.jongnoAccentPalettes) {
          const cur = (window.jongnoCurrentAccent && window.jongnoCurrentAccent()) || 'sage';
          Object.keys(window.jongnoAccentPalettes).forEach((key) => {
            const p = window.jongnoAccentPalettes[key];
            const b = document.createElement('button');
            b.className = 'am-swatch' + (key === cur ? ' active' : '');
            b.style.background = p[1][0];
            b.title = p[0];
            b.setAttribute('aria-label', p[0]);
            b.onclick = () => {
              window.jongnoApplyAccent(key);
              sw.querySelectorAll('.am-swatch').forEach(x => x.classList.remove('active'));
              b.classList.add('active');
            };
            sw.appendChild(b);
          });
        }
      })();
    </script>
