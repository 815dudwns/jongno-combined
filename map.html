<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meter Care Solution</title>
    <!-- 즉시 인증 체크 + 자동 캐시 마이그레이션 -->
    <script>
      // 앱 버전 바뀌면 localStorage 자동 클리어 (auth/eventQueue만 유지)
      // 폰 사용자가 콘솔 없이도 새 버전 받게
      (function () {
        const APP_VERSION = '20260606theme2';
        if (localStorage.getItem('app_version') !== APP_VERSION) {
          const keep = {};
          ['jongno_auth', 'jongno_event_queue', 'jongno_theme', 'jongno_accent', 'jongno_selected_groups', 'jongno_selected_checkdays', 'jongno_marker_mode', 'jongno_map_view', 'jongno_admin_view_role', 'jongno_comm_missing_only', 'jongno_stats_date', 'jongno_stats_tab'].forEach(k => {
            const v = localStorage.getItem(k);
            if (v !== null) keep[k] = v;
          });
          localStorage.clear();
          Object.entries(keep).forEach(([k, v]) => localStorage.setItem(k, v));
          localStorage.setItem('app_version', APP_VERSION);
          // 캐시 강제 갱신 — 새 버전이면 한 번 더 reload (sessionStorage로 1회 보장)
          const reloadKey = 'jongno_reloaded_for_' + APP_VERSION;
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            window.location.reload();
            return;
          }
        }
      })();
      // 인증 체크 (즉시)
      if (!localStorage.getItem('jongno_auth')) {
        document.documentElement.style.visibility = 'hidden';
        window.location.replace('login.html');
      }
      // bfcache 복귀(뒤로가기) 시 재검사 — 로그아웃 후 뒤로가기로 맵 노출 차단
      window.addEventListener('pageshow', function (e) {
        if (e.persisted && !localStorage.getItem('jongno_auth')) {
          document.documentElement.style.visibility = 'hidden';
          window.location.replace('login.html');
        }
      });
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <!-- QR/바코드 라이브 스캔 -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="css/clay.css?v=20260608glow">
    <link rel="stylesheet" href="css/common.css?v=20260608seq">
    <link rel="stylesheet" href="css/marker.css?v=20260607marker8">
    <link rel="stylesheet" href="css/panel.css?v=20260608accent">
    <link rel="stylesheet" href="css/replacement-modal.css?v=20260608d4">
</head>
<body>
    <div id="map"></div>

    <div id="toast" class="toast">복사했습니다</div>
    <button class="loc-btn" id="loc-btn" onclick="toggleLocation()" aria-label="현재 위치"><span class="loc-ico"></span></button>

    <!-- 동그룹 필터 -->
    <div class="dong-group-filter">
        <button class="dong-group-toggle" id="dong-group-toggle">동그룹 ▾</button>
        <div class="dong-group-panel" id="dong-group-panel">

        </div>

    <!-- 통신팀 누락만 필터 (켜면 모든 필터 무시, 통신팀이 빼먹은 주소만) -->
    <label class="comm-missing-filter" id="comm-missing-filter">
        <input type="checkbox" id="comm-missing-only"> 미연계
    </label>

    <!-- 검침일 필터 (계기팀 시각에서만 표시) -->

        <button class="checkday-toggle" id="checkday-toggle">검침일 ▾</button>
        <div class="checkday-panel" id="checkday-panel">

        </div>

        <button class="topbar-btn menu-trigger" id="menu-trigger" aria-label="메뉴">메뉴</button>

    <!-- 앱 메뉴 패널 -->
    <div class="app-menu-overlay" id="app-menu-overlay"></div>
    <div class="app-menu" id="app-menu">

                <span class="am-txt">테마</span>
                <span class="am-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
            </button>
            <div class="am-body">
                <div class="am-sub">
                    <span class="am-sub-label">다크모드</span>
                    <button class="am-theme-btn" data-theme-toggle onclick="jongnoCycleTheme()">시스템</button>
                </div>
                <div class="am-sub">
                    <span class="am-sub-label">테마색</span>
                    <div class="am-swatches" id="am-swatches"></div>
                </div>
            </div>
        </div>

        <!-- 통계 (링크) -->
        <a class="am-row am-link" id="stats-btn" href="stats.html" style="display:none;">
            <span class="am-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><rect x="7" y="11" width="3" height="5" rx="0.5"/><rect x="12.5" y="7" width="3" height="9" rx="0.5"/><rect x="18" y="13" width="3" height="3" rx="0.5"/></svg></span>
            <span class="am-txt">통계</span>
            <span class="am-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>

        <!-- 관리자 (트리, admin 전용) -->
        <div class="am-tree am-admin" id="am-admin" data-tree style="display:none;">
            <button class="am-row am-head" type="button">
                <span class="am-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg></span>
                <span class="am-txt">관리자</span>
                <span class="am-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
            </button>
            <div class="am-body">
                <a class="am-row am-link am-sub-link" id="admin-btn" href="admin.html">
                    <span class="am-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>
                    <span class="am-txt">리포트</span>
                    <span class="am-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
                </a>
                <div class="am-sub">
                    <span class="am-sub-label">시각</span>
                    <div class="view-role-toggle" id="view-role-toggle">
                        <button data-view="meter" class="active">계기팀</button>
                        <button data-view="comm">통신팀</button>
                    </div>
                </div>
                <div class="am-sub">
                    <span class="am-sub-label">마커</span>
                    <div class="marker-mode-toggle" id="marker-mode-toggle">
                        <button data-mode="checkday" class="active">검침일</button>
                        <button data-mode="priority">우선순위</button>
                        <button data-mode="both">둘다</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="am-sep"></div>
        <button class="am-row am-logout" onclick="authLogout()">
            <span class="am-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M9 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/></svg></span>
            <span class="am-txt">로그아웃</span>
        </button>
    </div>

    <!-- 검색 모달 -->
    <div id="search-overlay" class="search-overlay" onclick="if(event.target===this)closeSearch()">
        <div class="search-modal">
            <div class="search-header">
                <h3>검색</h3>
                <button class="close-btn" onclick="closeSearch()">×</button>
            </div>
            <div class="search-input-row">
                <input type="text" id="search-input" placeholder="주소 또는 계기번호 검색" autocomplete="off" onkeydown="if(event.key==='Enter')runSearch()">
                <button class="search-go-btn" onclick="runSearch()">검색</button>
            </div>
            <div class="search-hint" id="search-hint">4자 이상 입력하세요</div>
            <div class="search-results" id="search-results"></div>
        </div>
    </div>

    <div id="fullpage-overlay" class="fullpage-overlay">
        <!-- 상태 색상 바 (기능 3): pending이면 투명, 나머지는 상태별 색상 -->
        <div id="status-bar" class="status-bar"></div>
        <div class="overlay-header">
            <div class="overlay-address">
                <h3 id="detail-address"></h3>
                <p id="detail-road-address"></p>
            </div>
            <div class="header-buttons">
                <div class="map-app-btns">
                    <button class="map-app-btn" id="tmap-btn" aria-label="티맵 길찾기"><span class="nb-mark">T</span></button>
                    <button class="map-app-btn" id="naver-btn" aria-label="네이버 길찾기"><span class="nb-mark">N</span></button>
                    <button class="map-app-btn" id="kakao-btn" aria-label="카카오 길찾기"><span class="nb-mark">K</span></button>
                </div>
                <button class="close-btn" onclick="closeDetail()">×</button>
            </div>
        </div>
        <!-- 작업자 정보 (기능 4): 지도앱 버튼 아래, pending이거나 정보 없으면 숨김 -->
        <div id="worker-info" class="worker-info" style="display:none;"></div>
        <div class="overlay-actions">
            <div class="action-btn-row">
                <button class="action-btn complete" id="btn-complete">완료</button>
                <button class="action-btn hold" id="btn-hold">보류</button>
                <button class="action-btn fail" id="btn-fail">불가</button>
                <a id="admin-upload-btn" href="admin.html" style="display:none;padding:10px 12px;background:#1e3a8a;color:white;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;">사진등록</a>
                <button class="action-btn" id="btn-add-meter" style="display:none;background:var(--mint-soft);border:none;color:var(--ink);white-space:nowrap;">+ 계기 추가</button>
            </div>
            <div class="fail-reason-row">
                <input type="text" class="fail-reason" id="fail-reason" placeholder="불가 사유">
            </div>
            <div class="search-row">
                <input type="text" inputmode="numeric" class="meter-search" id="meter-search" placeholder="계기 검색 (숫자 2자리 이상)">
                <button class="search-reset-btn" id="meter-search-reset" onclick="document.getElementById('meter-search').value='';renderMetersList();">✕</button>
            </div>
        </div>
        <div id="common-pole" class="common-pole" style="display:none;"></div>
        <!-- 계기 리스트 정렬 버튼 바 -->
        <div class="meter-sort-bar" id="meter-sort-bar">
            <button class="sort-btn" id="sort-btn-dup" onclick="toggleSort('dup')">중복 정렬</button>
            <button class="sort-btn" id="sort-btn-maker" onclick="toggleSort('maker')">제조사 정렬</button>
        </div>
        <div class="overlay-meters" id="meters-list"></div>
    </div>

    <!-- 계기 교체 입력 모달 -->
    <div id="rpl-modal" class="rpl-modal">
      <div class="rpl-card">
        <div class="rpl-header">
          <div style="flex:1;min-width:0;">
            <h3>계기 교체 등록</h3>
            <p id="rpl-title-addr" style="font-size:12px;color:#6b7280;margin:2px 0 0;line-height:1.3;word-break:break-all;"></p>
          </div>
          <span class="rpl-seq" id="rpl-seq">오늘 <button type="button" id="rpl-seq-dec" class="rpl-seq-btn">‹</button> <span class="num" id="rpl-seq-num">?</span> <button type="button" id="rpl-seq-inc" class="rpl-seq-btn">›</button> 번째</span>
          <button class="rpl-close" id="rpl-close">×</button>
        </div>

        <div class="rpl-current-meter rpl-replace-only" id="rpl-current-meter" style="display:none;">
          <span class="rpl-current-label">현재 계기번호</span>
          <strong id="rpl-current-meter-id">-</strong>
        </div>

        <div class="rpl-field rpl-add-only" style="display:none;">
          <label>계기 11자리</label>
          <input type="text" id="rpl-old-meter-id" inputmode="numeric" maxlength="11" placeholder="">
          <div class="rpl-alpha-row" style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
            <button type="button" class="rpl-alpha-btn" data-ch="A">A</button>
            <button type="button" class="rpl-alpha-btn" data-ch="B">B</button>
            <button type="button" class="rpl-alpha-btn" data-ch="G">G</button>
            <button type="button" class="rpl-alpha-btn" data-ch="L">L</button>
            <button type="button" class="rpl-alpha-btn" data-ch="BS" style="margin-left:auto;background:#fee2e2;color:#dc2626;">⌫</button>
          </div>
        </div>

        <div class="rpl-replace-only" id="rpl-removal-fields">
          <div class="rpl-field" id="rpl-rv-field-whme-day" style="display:none;">
            <label>철거 주간(kWh)</label>
            <input type="text" id="rpl-rv-whme-day" inputmode="numeric" placeholder="예: 12345">
            <div class="rpl-photo rpl-rv-photo" id="rpl-rv-photo-whme-day" data-field="whme_day">
              <span class="rpl-photo-label">주간 계기판 사진 (탭하여 선택)</span>
              <img class="rpl-photo-preview" alt="주간 계기판">
            </div>
            <input type="file" class="rpl-rv-photo-input" id="rpl-rv-photo-input-whme-day" data-field="whme_day" accept="image/*" style="display:none;">
          </div>
          <div class="rpl-field" id="rpl-rv-field-whme-mngt" style="display:none;">
            <label>철거 야간(kWh)</label>
            <input type="text" id="rpl-rv-whme-mngt" inputmode="numeric" placeholder="예: 12345">
            <div class="rpl-photo rpl-rv-photo" id="rpl-rv-photo-whme-mngt" data-field="whme_mngt">
              <span class="rpl-photo-label">야간 계기판 사진 (탭하여 선택)</span>
              <img class="rpl-photo-preview" alt="야간 계기판">
            </div>
            <input type="file" class="rpl-rv-photo-input" id="rpl-rv-photo-input-whme-mngt" data-field="whme_mngt" accept="image/*" style="display:none;">
          </div>
          <div class="rpl-field" id="rpl-rv-field-dm-mt" style="display:none;">
            <label>최대전력(kW)</label>
            <input type="text" id="rpl-rv-dm-mt" inputmode="numeric" placeholder="예: 5">
            <div class="rpl-photo rpl-rv-photo" id="rpl-rv-photo-dm-mt" data-field="dm_mt_day">
              <span class="rpl-photo-label">최대전력 계기판 사진 (탭하여 선택)</span>
              <img class="rpl-photo-preview" alt="최대전력 계기판">
            </div>
            <input type="file" class="rpl-rv-photo-input" id="rpl-rv-photo-input-dm-mt" data-field="dm_mt_day" accept="image/*" style="display:none;">
          </div>
          <div class="rpl-field" id="rpl-rv-field-var" style="display:none;">
            <label>무효전력(kVar)</label>
            <input type="text" id="rpl-rv-var" inputmode="numeric" placeholder="예: 0">
            <div class="rpl-photo rpl-rv-photo" id="rpl-rv-photo-var" data-field="var_day">
              <span class="rpl-photo-label">무효 계기판 사진 (탭하여 선택)</span>
              <img class="rpl-photo-preview" alt="무효 계기판">
            </div>
            <input type="file" class="rpl-rv-photo-input" id="rpl-rv-photo-input-var" data-field="var_day" accept="image/*" style="display:none;">
          </div>
        </div>

        <div class="rpl-field rpl-replace-only">
          <label>새 계기번호</label>
          <div class="rpl-input-with-qr">
            <input type="text" id="rpl-new-meter-id" inputmode="numeric" maxlength="11" placeholder="QR 또는 직접 입력">
            <button class="rpl-qr-btn" id="rpl-qr-btn">QR</button>
          </div>
        </div>

        <div class="rpl-photo rpl-replace-only" id="rpl-new-photo">
          <span class="rpl-photo-label">새 계기 사진 (탭하여 선택)</span>
          <img class="rpl-photo-preview" alt="새 계기">
        </div>
        <input type="file" id="rpl-new-photo-input" accept="image/*" style="display:none;">

        <div class="rpl-field rpl-replace-only">
          <label>제조년월 (선택/수정 가능)</label>
          <div class="rpl-mfg-row">
            <select id="rpl-mfg-y"></select>
            <select id="rpl-mfg-m"></select>
          </div>
        </div>

        <div class="rpl-replace-only" id="rpl-extra-wrap">
          <div id="rpl-extra-rows"></div>
          <button type="button" class="rpl-extra-add" id="rpl-extra-add">+ 추가 데이터</button>
        </div>

        <div class="rpl-footer">
          <button class="rpl-btn" id="rpl-delete" style="display:none;">삭제</button>
          <button class="rpl-btn cancel" id="rpl-cancel">취소</button>
          <button class="rpl-btn draft" id="rpl-draft">임시 저장</button>
          <button class="rpl-btn save" id="rpl-save">저장</button>
        </div>
      </div>
    </div>

    <div id="rpl-toast" class="rpl-toast"></div>

    <!-- QR 라이브 스캔 오버레이 (전체 화면) — ami-work와 동일 패턴 -->
    <div id="qr-scan-overlay" style="display:none;position:fixed;inset:0;background:black;z-index:3000;flex-direction:column;">
      <div style="display:flex;align-items:center;padding:10px 14px;background:#111;color:white;gap:8px;">
        <span id="qr-cam-label" style="font-size:12px;font-weight:600;white-space:nowrap;">카메라</span>
        <select id="qr-cam-select" style="flex:1;min-width:140px;padding:8px 10px;background:#374151;color:white;border:1.5px solid #6b7280;border-radius:6px;font-size:13px;font-weight:600;appearance:auto;-webkit-appearance:auto;"><option>카메라 로드 중...</option></select>
        <button id="qr-close-btn" style="padding:6px 12px;background:#ef4444;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;">×</button>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;background:black;overflow:hidden;">
        <div id="qr-reader" style="width:min(100vw, 100%); aspect-ratio:1/1; max-height:100%; background:black; position:relative; overflow:hidden;"></div>
      </div>
      <div id="qr-error-msg" style="display:none;padding:14px;background:#7f1d1d;color:white;font-size:13px;text-align:center;"></div>
      <div style="display:flex;gap:6px;padding:8px;background:#111;">
        <button id="qr-switch-btn" style="display:none;flex:1;padding:10px;background:#374151;color:white;border:none;border-radius:6px;font-size:14px;font-weight:700;">카메라 전환</button>

    <script>
      // 앱 메뉴 토글 + 테마색 스와치
      (function () {
        const trigger = document.getElementById('menu-trigger');
        const menu = document.getElementById('app-menu');
        const overlay = document.getElementById('app-menu-overlay');
        if (!trigger || !menu || !overlay) return;
        const openMenu = () => { menu.classList.add('open'); overlay.classList.add('open'); };
        const closeMenu = () => { menu.classList.remove('open'); overlay.classList.remove('open'); };
        trigger.onclick = openMenu;
        overlay.onclick = closeMenu;
        const closeBtn = document.getElementById('am-close');
        if (closeBtn) closeBtn.onclick = closeMenu;
        // 트리 펼침/접힘
        menu.querySelectorAll('.am-tree > .am-head').forEach(h => {
          h.onclick = () => h.parentElement.classList.toggle('open');
        });
        // 테마색 스와치 렌더
        const sw = document.getElementById('am-swatches');
        if (sw && window.jongnoAccentPalettes) {
          const cur = (window.jongnoCurrentAccent && window.jongnoCurrentAccent()) || 'sage';
          Object.keys(window.jongnoAccentPalettes).forEach((key) => {
            const p = window.jongnoAccentPalettes[key];
            const b = document.createElement('button');
            b.className = 'am-swatch' + (key === cur ? ' active' : '');
            b.style.background = p[1][0];
            b.title = p[0];
            b.setAttribute('aria-label', p[0]);
            b.onclick = () => {
              window.jongnoApplyAccent(key);
              sw.querySelectorAll('.am-swatch').forEach(x => x.classList.remove('active'));
              b.classList.add('active');
            };
            sw.appendChild(b);
          });
        }
      })();
    </script>
