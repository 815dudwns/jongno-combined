<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검침값 검증</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#eee;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#bar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#111}
#prog{font-size:14px;color:#aaa}#meta{font-size:13px;color:#7ab8ff}
#img-wrap{flex-shrink:0;padding:0 14px}
#img{width:100%;border-radius:10px;background:#222;display:block;max-height:38vh;object-fit:contain}
#actions{flex:1;overflow-y:auto;padding:10px 14px 20px}
/* 버튼 공통 */
.btn{width:100%;margin-bottom:8px;padding:15px 16px;border-radius:10px;border:2px solid #3a3a3e;background:#26262a;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left}
.btn .val{font-size:20px;font-weight:700;letter-spacing:1px}
.btn .src{font-size:12px;font-weight:500;color:#888;white-space:nowrap;margin-left:8px}
.btn:active{border-color:#16a34a;background:#16432a}
.btn.worker{border-color:#2563eb;background:#1a2a4a}
.btn.worker .src{color:#7ab8ff}
.btn.worker:active{background:#2563eb}
/* 직접입력 */
.custom-wrap{display:flex;gap:8px;margin-bottom:8px}
.custom-wrap input{flex:1;padding:15px 14px;font-size:18px;font-weight:700;border-radius:10px;border:2px solid #3a3a3e;background:#26262a;color:#fff}
.custom-wrap button{padding:14px 18px;font-size:14px;font-weight:700;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer;white-space:nowrap}
#reason{width:100%;padding:13px;font-size:15px;border-radius:10px;border:2px solid #5a3030;background:#2a1f1f;color:#fff;margin-bottom:8px}
#nav{display:flex;gap:8px}
#nav button{flex:1;padding:13px;font-size:15px;border:0;border-radius:10px;background:#2a2a2e;color:#aaa;cursor:pointer}
#loading{text-align:center;padding:60px;font-size:16px;color:#888}
</style></head><body>
<div id="bar">
  <a href="map.html" style="font-size:13px;color:#7ab8ff;text-decoration:none;padding:6px 10px;border-radius:8px;background:#1a2a4a">← 지도</a>
  <span id="prog"></span><span id="meta"></span>
</div>
<div id="img-wrap"><img id="img" src="" onerror="this.style.background='#333'"></div>
<div id="actions"><div id="loading">케이스 로딩 중...</div></div>
<script>
const DBURL="https://ami-jongno-default-rtdb.asia-southeast1.firebasedatabase.app";
const STORE_KEY="cycle_review";
const $=id=>document.getElementById(id);
let CASES=[],VMAP={},order=[],i=0;

async function init(){
  // 케이스 + 판정 병렬 로드
  const [cr,vr]=await Promise.all([
    fetch(`${DBURL}/ocr_review_cases/${STORE_KEY}.json`).then(r=>r.json()),
    fetch(`${DBURL}/ocr_review/${STORE_KEY}.json`).then(r=>r.json())
  ]);
  VMAP=vr&&typeof vr==='object'?vr:{};
  if(!cr){$('loading').textContent='케이스 없음 (사이클 먼저 실행)';return;}
  // G타입 우선, 나머지 랜덤
  const arr=Object.entries(cr).map(([id,v])=>({id,...v}));
  const g=arr.filter(c=>c.type==='G').sort(()=>Math.random()-.5);
  const rest=arr.filter(c=>c.type!=='G').sort(()=>Math.random()-.5);
  CASES=[...g,...rest];
  buildOrder();
  renderCard();
}

function buildOrder(){
  order=CASES.filter(c=>!VMAP[c.id]).map(c=>c.id);
  if(i>=order.length)i=Math.max(0,order.length-1);
}

async function saveOne(id,verdict){
  VMAP[id]=verdict;
  try{await fetch(`${DBURL}/ocr_review/${STORE_KEY}/${encodeURIComponent(id)}.json`,
    {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(verdict)});}catch(e){}
}

function decide(id,verdict){
  saveOne(id,verdict);
  order=order.filter(x=>x!==id);
  if(i>=order.length)i=order.length-1;
  renderCard();
}

function renderCard(){
  const total=CASES.length,done=total-order.length;
  $('prog').textContent=`남은 ${order.length} · 완료 ${done}/${total}`;
  if(order.length===0){
    $('card').innerHTML=`<div style="text-align:center;padding:40px;font-size:18px">전부 완료 (${done}/${total})</div>`;
    $('meta').textContent='';return;
  }
  if(i<0)i=0;if(i>=order.length)i=order.length-1;
  const c=CASES.find(x=>x.id===order[i]);
  $('meta').textContent=c.meta||'';
  const cands=c.cands||[];
  const worker=cands.find(o=>o.src==='작업자');
  const others=cands.filter(o=>o.src!=='작업자');
  const seen={};others.forEach(o=>{if(!seen[o.val])seen[o.val]=[];seen[o.val].push(o.src);});
  // 이미지 업데이트
  $('img').src=c.img||'';
  // 액션 영역 렌더
  const workerBtn=worker
    ?`<button class="btn worker" onclick="decide('${c.id}',{type:'value',text:'${worker.val}'})"><span class="val">${worker.val}</span><span class="src">작업자</span></button>`
    :'';
  const otherBtns=Object.entries(seen).map(([val,srcs])=>
    `<button class="btn" onclick="decide('${c.id}',{type:'value',text:'${val}'})"><span class="val">${val}</span><span class="src">${srcs.join('/')}</span></button>`
  ).join('');
  $('actions').innerHTML=`
    ${workerBtn}${otherBtns}
    <div class="custom-wrap">
      <input id="custom" type="number" inputmode="numeric" placeholder="직접 입력">
      <button onclick="submitCustom('${c.id}')">제출</button>
    </div>
    <input id="reason" placeholder="불가 이유 (반사/블랭크/잘림 등)">
    <div id="nav"><button onclick="prev()">← 이전</button><button onclick="next()">다음 →</button></div>`;
  $('custom').onkeydown=e=>{if(e.key==='Enter')submitCustom(c.id);};
  $('reason').onchange=()=>{const t=$('reason').value.trim();if(t)decide(c.id,{type:'reason',text:t});};
  $('reason').onkeydown=e=>{if(e.key==='Enter')e.target.blur();};
}

function decideWorker(id,val){if(val)decide(id,{type:'value',text:val});}
function submitCustom(id){const t=($('custom')||{}).value?.trim();if(t)decide(id,{type:'custom',text:t});}
function next(){if(i<order.length-1){i++;renderCard();}}
function prev(){if(i>0){i--;renderCard();}}
document.onkeydown=e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft')prev();
};
init();
</script></body></html>
