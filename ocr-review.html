<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검침값 검증</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#eee;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#bar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#111}
#prog{font-size:14px;color:#aaa}#meta{font-size:13px;color:#7ab8ff}
#img-wrap{flex-shrink:0;padding:0 14px}
#img{width:100%;border-radius:10px;background:#222;display:block;max-height:26vh;object-fit:contain}
/* 큰 숫자 디스플레이 */
#disp{flex-shrink:0;margin:8px 14px 2px;padding:12px 16px;border-radius:12px;background:#000;border:2px solid #16a34a;
  font-family:'SF Mono',Menlo,monospace;font-size:38px;font-weight:700;letter-spacing:3px;color:#34d399;
  text-align:right;min-height:62px;overflow-x:auto;white-space:nowrap}
#disp.empty{color:#555;border-color:#3a3a3e}
#actions{flex:1;overflow-y:auto;padding:6px 14px 16px}
.btn{width:100%;margin-bottom:7px;padding:13px 14px;border-radius:10px;border:2px solid #3a3a3e;background:#26262a;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left;gap:8px}
.btn .val{font-size:19px;font-weight:700;letter-spacing:1px;flex:1}
.btn .src{font-size:12px;font-weight:500;color:#888;white-space:nowrap}
.btn .edit{font-size:13px;color:#7ab8ff;padding:6px 10px;border:1px solid #2563eb;border-radius:8px;background:#16223a;flex-shrink:0}
.btn:active{border-color:#16a34a;background:#16432a}
.btn.worker{border-color:#2563eb;background:#1a2a4a}.btn.worker .src{color:#7ab8ff}.btn.worker:active{background:#2563eb}
/* 숫자 키패드 */
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
#pad button{padding:16px 0;font-size:22px;font-weight:700;border:0;border-radius:10px;background:#2c2c30;color:#fff;font-family:'SF Mono',Menlo,monospace;cursor:pointer}
#pad button:active{background:#444}
#pad .ins{background:#3a2c50;color:#c4b5fd;font-size:15px}
#pad .del{background:#4a2020;color:#fca5a5}
#pad .ok{background:#16a34a;color:#fff;grid-column:span 3;font-size:18px;letter-spacing:1px}
#reason{width:100%;padding:12px;font-size:15px;border-radius:10px;border:2px solid #5a3030;background:#2a1f1f;color:#fff;margin:8px 0}
#nav{display:flex;gap:8px}
#nav button{flex:1;padding:13px;font-size:15px;border:0;border-radius:10px;background:#2a2a2e;color:#aaa;cursor:pointer}
#hint{font-size:11px;color:#777;margin-top:8px;text-align:center;line-height:1.5}
#loading{text-align:center;padding:60px;font-size:16px;color:#888}
</style></head><body>
<div id="bar">
  <a href="map.html" style="font-size:13px;color:#7ab8ff;text-decoration:none;padding:6px 10px;border-radius:8px;background:#1a2a4a">← 지도</a>
  <span id="prog"></span><span id="meta"></span>
</div>
<div id="img-wrap"><img id="img" src="" onerror="this.style.background='#333'"></div>
<div id="disp" class="empty">0</div>
<div id="actions"><div id="loading">케이스 로딩 중...</div></div>
<script>
const DBURL="https://ami-jongno-default-rtdb.asia-southeast1.firebasedatabase.app";
const STORE_KEY="cycle_review";
const $=id=>document.getElementById(id);
let CASES=[],VMAP={},order=[],i=0;
let buf="",cur=0;   // 디스플레이 버퍼 + 커서(삽입 위치)

function drawDisp(){
  const d=$('disp');
  if(buf===""){d.textContent="0";d.className="empty";return;}
  d.className="";
  d.textContent = cur>=buf.length ? buf : buf.slice(0,cur)+"▏"+buf.slice(cur);
}
function setBuf(s){buf=String(s||"");cur=buf.length;drawDisp();}
function key(k){
  if(k==='del'){if(cur>0){buf=buf.slice(0,cur-1)+buf.slice(cur);cur--;}}
  else if(k==='clr'){buf="";cur=0;}
  else if(k==='insL'){if(cur>0)cur--;}
  else if(k==='insR'){if(cur<buf.length)cur++;}
  else if(k==='ok'){submitBuf();return;}
  else{buf=buf.slice(0,cur)+k+buf.slice(cur);cur++;}
  drawDisp();
}

async function init(){
  const [cr,vr]=await Promise.all([
    fetch(`${DBURL}/ocr_review_cases/${STORE_KEY}.json`).then(r=>r.json()),
    fetch(`${DBURL}/ocr_review/${STORE_KEY}.json`).then(r=>r.json())
  ]);
  VMAP=vr&&typeof vr==='object'?vr:{};
  if(!cr){$('loading').textContent='케이스 없음 (사이클 먼저 실행)';return;}
  const arr=Object.entries(cr).map(([id,v])=>({id,...v}));
  const g=arr.filter(c=>c.type==='G').sort(()=>Math.random()-.5);
  const rest=arr.filter(c=>c.type!=='G').sort(()=>Math.random()-.5);
  CASES=[...g,...rest];
  buildOrder();
  renderCard();
}
function buildOrder(){order=CASES.filter(c=>!VMAP[c.id]).map(c=>c.id);if(i>=order.length)i=Math.max(0,order.length-1);}
async function saveOne(id,verdict){
  VMAP[id]=verdict;
  try{await fetch(`${DBURL}/ocr_review/${STORE_KEY}/${encodeURIComponent(id)}.json`,
    {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(verdict)});}catch(e){}
}
function decide(id,verdict){saveOne(id,verdict);order=order.filter(x=>x!==id);if(i>=order.length)i=order.length-1;renderCard();}

function renderCard(){
  const total=CASES.length,done=total-order.length;
  $('prog').textContent=`남은 ${order.length} · 완료 ${done}/${total}`;
  if(order.length===0){
    $('actions').innerHTML=`<div style="text-align:center;padding:40px;font-size:18px">전부 완료 (${done}/${total})</div>`;
    $('meta').textContent='';$('img').src='';setBuf("");return;
  }
  if(i<0)i=0;if(i>=order.length)i=order.length-1;
  const c=CASES.find(x=>x.id===order[i]);
  $('meta').textContent=c.meta||'';
  $('img').src=c.img||'';
  const cands=c.cands||[];
  const worker=cands.find(o=>o.src==='작업자');
  const others=cands.filter(o=>o.src!=='작업자');
  const seen={};others.forEach(o=>{if(!seen[o.val])seen[o.val]=[];seen[o.val].push(o.src);});
  const workerBtn=worker
    ?`<button class="btn worker" data-val="${worker.val}"><span class="val">${worker.val}</span><span class="src">작업자</span><span class="edit" data-edit="${worker.val}">수정</span></button>`:'';
  const otherBtns=Object.entries(seen).map(([val,srcs])=>
    `<button class="btn" data-val="${val}"><span class="val">${val}</span><span class="src">${srcs.join('/')}</span><span class="edit" data-edit="${val}">수정</span></button>`
  ).join('');
  $('actions').innerHTML=`
    ${workerBtn}${otherBtns}
    <div id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k=".">.</button><button data-k="0">0</button><button class="del" data-k="del">&#9003;</button>
      <button class="ins" data-k="insL">&#9668; 삽입</button><button class="ins" data-k="insR">삽입 &#9658;</button><button class="del" data-k="clr">전체삭제</button>
      <button class="ok" data-k="ok">이 값으로 제출</button>
    </div>
    <input id="reason" placeholder="불가 이유 (반사/블랭크/잘림 등)">
    <div id="nav"><button onclick="prev()">← 이전</button><button onclick="next()">다음 →</button></div>
    <div id="hint">맞으면 후보/작업자 본문 클릭 = 즉시 다음 · [수정]으로 불러와 키패드로 고치기<br>삽입 = 커서를 좌/우로 옮겨 그 자리에 숫자 끼워넣기 (OCR이 한 자리 빠뜨린 경우)</div>`;
  // 후보 버튼: 본문=즉시제출, [수정]=디스플레이 로드
  document.querySelectorAll('#actions .btn').forEach(b=>{
    b.onclick=(e)=>{
      if(e.target.dataset.edit!==undefined){setBuf(e.target.dataset.edit);e.stopPropagation();return;}
      decide(c.id,{type:'value',text:b.dataset.val});
    };
  });
  document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  $('reason').onchange=()=>{const t=$('reason').value.trim();if(t)decide(c.id,{type:'reason',text:t});};
  $('reason').onkeydown=e=>{if(e.key==='Enter')e.target.blur();};
  setBuf("");
}
function submitBuf(){if(order.length===0)return;const c=CASES.find(x=>x.id===order[i]);if(!c)return;const t=buf.trim();if(t&&t!=='.')decide(c.id,{type:'custom',text:t});}
function next(){if(i<order.length-1){i++;renderCard();}}
function prev(){if(i>0){i--;renderCard();}}
document.onkeydown=e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){cur<buf.length?key('insR'):next();}
  else if(e.key==='ArrowLeft'){cur>0?key('insL'):prev();}
  else if(/^[0-9.]$/.test(e.key))key(e.key);
  else if(e.key==='Backspace')key('del');
  else if(e.key==='Enter')submitBuf();
};
init();
</script></body></html>
